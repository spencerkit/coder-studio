name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate changesets metadata
        run: pnpm changeset:validate

      - name: Run lint
        run: pnpm ci:lint

      - name: Run tests
        run: pnpm ci:test

      - name: Run production build
        run: pnpm ci:build

  windows-runtime-verify:
    name: Windows runtime verification
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Windows CI now proves that our non-PTY subprocess paths pass `windowsHide: true`
      # and that provider/session PTY startup still works with the existing cross-platform
      # argv contract. It does not visually prove the absence of a transient desktop
      # console flash from node-pty itself; that still requires a manual smoke check on
      # a real Windows desktop.
      - name: Run targeted Windows provider tests
        run: pnpm --filter @coder-studio/providers exec vitest run src/claude/definition.test.ts src/codex/definition.test.ts

      - name: Run targeted Windows server tests
        run: pnpm --filter @coder-studio/server exec vitest run src/__tests__/provider-runtime/command-check.test.ts src/__tests__/provider-runtime/command-runner.test.ts src/__tests__/provider-runtime/install-manager.test.ts src/__tests__/workspace/runtime-check.test.ts src/git/cli.windows.test.ts src/supervisor/evaluator.windows.test.ts src/__tests__/server-provider-install-wiring.test.ts src/__tests__/session-commands.test.ts src/__tests__/session-integration.test.ts

      - name: Run targeted Windows CLI tests
        run: pnpm --filter @spencer-kit/coder-studio exec vitest run src/browser.test.ts src/bin.test.ts src/pm2-control.test.ts src/server-control.test.ts

      - name: Build web assets for CLI packaging
        run: pnpm build:web

      - name: Build server package
        run: pnpm --filter @coder-studio/server build

      - name: Build CLI package
        run: pnpm --filter @spencer-kit/coder-studio build

  desktop-windows-verify:
    name: Desktop Windows package and smoke
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and type-check Desktop
        run: |
          pnpm --filter @coder-studio/desktop test
          pnpm --filter @coder-studio/desktop typecheck

      - name: Build unsigned Windows installer and Runtime
        run: pnpm dist:desktop

      - name: Smoke packaged Engine, Runtime, PTY, and Electron window
        run: pnpm smoke:desktop

      - name: Stage and validate Windows release assets
        run: |
          pnpm desktop:artifacts stage --directory release/desktop-release-windows --components 'desktop,win-runtime'
          pnpm desktop:artifacts validate --directory release/desktop-release-windows --components 'desktop,win-runtime' --allow-unsigned

      - name: Upload Windows verification assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ github.sha }}
          path: release/desktop-release-windows/
          if-no-files-found: error
          retention-days: 3

  desktop-linux-assets-verify:
    name: WSL Engine and Runtime verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned WSL Engine and Server Runtime
        run: |
          pnpm build:wsl-engine
          pnpm build:wsl-runtime

      - name: Stage and validate WSL release assets
        run: |
          pnpm desktop:artifacts stage --directory release/desktop-release-linux --components 'wsl-engine,wsl-runtime'
          pnpm desktop:artifacts validate --directory release/desktop-release-linux --components 'wsl-engine,wsl-runtime' --allow-unsigned

      - name: Upload WSL verification assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ github.sha }}
          path: release/desktop-release-linux/
          if-no-files-found: error
          retention-days: 3
