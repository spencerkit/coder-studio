name: CI

on:
  workflow_dispatch:
    inputs:
      publish_acceptance:
        description: "Publish a signed, tag-pinned Desktop acceptance channel"
        required: true
        default: true
        type: boolean
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance_channel:
    name: Prepare manual acceptance channel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.channel.outputs.enabled }}
      release_tag: ${{ steps.channel.outputs.release_tag }}
      release_base_url: ${{ steps.channel.outputs.release_base_url }}
      runtime_update_url: ${{ steps.channel.outputs.runtime_update_url }}

    steps:
      - name: Resolve acceptance channel
        id: channel
        shell: bash
        env:
          ACCEPTANCE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_acceptance }}
        run: |
          echo "enabled=${ACCEPTANCE_ENABLED}" >> "${GITHUB_OUTPUT}"
          if [[ "${ACCEPTANCE_ENABLED}" != "true" ]]; then
            exit 0
          fi

          release_tag="desktop-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_base_url=${release_base_url}" >> "${GITHUB_OUTPUT}"
          echo "runtime_update_url=${release_base_url}/coder-studio-runtime-win32-x64.manifest.json" >> "${GITHUB_OUTPUT}"

      - name: Generate ephemeral Runtime signing key
        if: steps.channel.outputs.enabled == 'true'
        shell: bash
        run: |
          mkdir -p release/desktop-ci-signing
          openssl genpkey -algorithm Ed25519 -out release/desktop-ci-signing/runtime-private.pem
          openssl pkey \
            -in release/desktop-ci-signing/runtime-private.pem \
            -pubout \
            -out release/desktop-ci-signing/runtime-public.pem

      - name: Upload ephemeral signing key
        if: steps.channel.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ci-signing-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/desktop-ci-signing/
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate changesets metadata
        run: pnpm changeset:validate

      - name: Run lint
        run: pnpm ci:lint

      - name: Run tests
        run: pnpm ci:test

      - name: Run production build
        run: pnpm ci:build

  windows-runtime-verify:
    name: Windows runtime verification
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Windows CI now proves that our non-PTY subprocess paths pass `windowsHide: true`
      # and that provider/session PTY startup still works with the existing cross-platform
      # argv contract. It does not visually prove the absence of a transient desktop
      # console flash from node-pty itself; that still requires a manual smoke check on
      # a real Windows desktop.
      - name: Run targeted Windows provider tests
        run: pnpm --filter @coder-studio/providers exec vitest run src/claude/definition.test.ts src/codex/definition.test.ts

      - name: Run targeted Windows server tests
        run: pnpm --filter @coder-studio/server exec vitest run src/__tests__/provider-runtime/command-check.test.ts src/__tests__/provider-runtime/command-runner.test.ts src/__tests__/provider-runtime/install-manager.test.ts src/__tests__/workspace/runtime-check.test.ts src/git/cli.windows.test.ts src/supervisor/evaluator.windows.test.ts src/__tests__/server-provider-install-wiring.test.ts src/__tests__/session-commands.test.ts src/__tests__/session-integration.test.ts

      - name: Run targeted Windows CLI tests
        run: pnpm --filter @spencer-kit/coder-studio exec vitest run src/browser.test.ts src/bin.test.ts src/pm2-control.test.ts src/server-control.test.ts

      - name: Build web assets for CLI packaging
        run: pnpm build:web

      - name: Build server package
        run: pnpm --filter @coder-studio/server build

      - name: Build CLI package
        run: pnpm --filter @spencer-kit/coder-studio build

  desktop-windows-verify:
    name: Desktop Windows package and smoke
    needs: acceptance_channel
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download acceptance signing key
        if: needs.acceptance_channel.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: desktop-ci-signing-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/desktop-ci-signing

      - name: Configure signed acceptance channel
        if: needs.acceptance_channel.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $privateKey = Get-Content release/desktop-ci-signing/runtime-private.pem -Raw
          $publicKey = Get-Content release/desktop-ci-signing/runtime-public.pem -Raw
          @"
          CODER_STUDIO_RUNTIME_SIGNING_PRIVATE_KEY<<PRIVATE_KEY
          $privateKey
          PRIVATE_KEY
          CODER_STUDIO_RUNTIME_PUBLIC_KEY<<PUBLIC_KEY
          $publicKey
          PUBLIC_KEY
          CODER_STUDIO_RUNTIME_UPDATE_URL=${{ needs.acceptance_channel.outputs.runtime_update_url }}
          "@ | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test and type-check Desktop
        run: |
          pnpm --filter @coder-studio/desktop test
          pnpm --filter @coder-studio/desktop typecheck

      - name: Build Windows installer and Runtime
        run: pnpm dist:desktop

      - name: Smoke packaged Engine, Runtime, PTY, and Electron window
        run: pnpm smoke:desktop

      - name: Stage and validate Windows release assets
        shell: pwsh
        run: |
          pnpm desktop:artifacts stage --directory release/desktop-release-windows --components 'desktop,win-runtime'
          if ("${{ needs.acceptance_channel.outputs.enabled }}" -eq "true") {
            pnpm desktop:artifacts validate --directory release/desktop-release-windows --components 'desktop,win-runtime'
          } else {
            pnpm desktop:artifacts validate --directory release/desktop-release-windows --components 'desktop,win-runtime' --allow-unsigned
          }

      - name: Upload Windows verification assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ github.sha }}
          path: release/desktop-release-windows/
          if-no-files-found: error
          retention-days: 3

  desktop-linux-assets-verify:
    name: WSL Engine and Runtime verification
    needs: acceptance_channel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download acceptance signing key
        if: needs.acceptance_channel.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: desktop-ci-signing-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/desktop-ci-signing

      - name: Configure signed acceptance channel
        if: needs.acceptance_channel.outputs.enabled == 'true'
        shell: bash
        run: |
          {
            echo 'CODER_STUDIO_RUNTIME_SIGNING_PRIVATE_KEY<<PRIVATE_KEY'
            cat release/desktop-ci-signing/runtime-private.pem
            echo 'PRIVATE_KEY'
            echo 'CODER_STUDIO_RUNTIME_PUBLIC_KEY<<PUBLIC_KEY'
            cat release/desktop-ci-signing/runtime-public.pem
            echo 'PUBLIC_KEY'
          } >> "${GITHUB_ENV}"

      - name: Build WSL Engine and Server Runtime
        run: |
          pnpm build:wsl-engine
          pnpm build:wsl-runtime

      - name: Stage and validate WSL release assets
        run: |
          pnpm desktop:artifacts stage --directory release/desktop-release-linux --components 'wsl-engine,wsl-runtime'
          if [[ "${{ needs.acceptance_channel.outputs.enabled }}" == "true" ]]; then
            pnpm desktop:artifacts validate --directory release/desktop-release-linux --components 'wsl-engine,wsl-runtime'
          else
            pnpm desktop:artifacts validate --directory release/desktop-release-linux --components 'wsl-engine,wsl-runtime' --allow-unsigned
          fi

      - name: Upload WSL verification assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ github.sha }}
          path: release/desktop-release-linux/
          if-no-files-found: error
          retention-days: 3

  publish-desktop-acceptance:
    name: Publish signed Desktop acceptance channel
    if: needs.acceptance_channel.outputs.enabled == 'true'
    needs:
      - acceptance_channel
      - verify
      - windows-runtime-verify
      - desktop-windows-verify
      - desktop-linux-assets-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download signed acceptance assets
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*-${{ github.sha }}
          path: release/desktop-acceptance
          merge-multiple: true

      - name: Download acceptance public key
        uses: actions/download-artifact@v4
        with:
          name: desktop-ci-signing-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/desktop-ci-signing

      - name: Load acceptance public key
        shell: bash
        run: |
          {
            echo 'CODER_STUDIO_RUNTIME_PUBLIC_KEY<<PUBLIC_KEY'
            cat release/desktop-ci-signing/runtime-public.pem
            echo 'PUBLIC_KEY'
          } >> "${GITHUB_ENV}"

      - name: Validate complete signed acceptance channel
        run: pnpm desktop:artifacts validate --directory release/desktop-acceptance --components 'desktop,win-runtime,wsl-engine,wsl-runtime'

      - name: Publish tag-pinned prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.acceptance_channel.outputs.release_tag }}
        run: |
          desktop_version=$(node -p "require('./packages/desktop/package.json').version")
          installer="Coder-Studio-Setup-${desktop_version}.exe"
          gh release create "${RELEASE_TAG}" \
            --target "${GITHUB_SHA}" \
            --title "Coder Studio Desktop acceptance ${GITHUB_RUN_NUMBER}" \
            --notes "Ephemeral signed acceptance channel for ${GITHUB_SHA}. The signing key is test-only; do not promote these assets to production." \
            --draft \
            release/desktop-acceptance/*
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease
          {
            echo "## Desktop acceptance channel"
            echo
            echo "- Installer: ${{ needs.acceptance_channel.outputs.release_base_url }}/${installer}"
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "- Runtime channel: ${{ needs.acceptance_channel.outputs.runtime_update_url }}"
          } >> "${GITHUB_STEP_SUMMARY}"
