name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: "npm dist-tag to publish under"
        required: true
        default: "latest"
        type: string
      desktop_acceptance_run_id:
        description: "Required when promoting latest: workflow run containing Desktop acceptance reports"
        required: false
        default: ""
        type: string
      promote:
        description: "Promote the accepted candidate to the requested npm tag and create the GitHub release"
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-release-channel
  cancel-in-progress: false

jobs:
  publish:
    name: Publish CLI package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure publish runs from main
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Publish workflow must run from main" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure there are no pending release changesets
        run: |
          pending_changesets=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md')
          if [ -n "${pending_changesets}" ]; then
            echo "Pending changesets exist. Merge the generated release PR before publishing." >&2
            echo "${pending_changesets}" >&2
            exit 1
          fi

      - name: Run release validation
        run: pnpm ci:release:validate

      - name: Read CLI version
        id: release
        env:
          FINAL_DIST_TAG: ${{ inputs.npm_tag }}
        run: |
          package_name=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('packages/cli/package.json', 'utf8')).name)")
          candidate_version=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('packages/cli/package.json', 'utf8')).version)")
          previous_version=$(npm view "${package_name}@${FINAL_DIST_TAG}" version --json | node -e "let d=''; process.stdin.on('data', c => d += c); process.stdin.on('end', () => console.log(JSON.parse(d)))")
          if [ -z "${package_name}" ] || [ -z "${candidate_version}" ] || [ -z "${previous_version}" ]; then
            echo "Failed to determine CLI version" >&2
            exit 1
          fi
          if [ "${candidate_version}" = "${previous_version}" ]; then
            echo "Candidate ${candidate_version} is already selected by ${FINAL_DIST_TAG}" >&2
            exit 1
          fi
          acceptance_tag="rc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "package_name=${package_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${candidate_version}" >> "${GITHUB_OUTPUT}"
          echo "previous_version=${previous_version}" >> "${GITHUB_OUTPUT}"
          echo "acceptance_tag=${acceptance_tag}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${candidate_version}" >> "${GITHUB_OUTPUT}"

      - name: Ensure release tag does not already exist
        run: |
          if git rev-parse --verify --quiet "refs/tags/${{ steps.release.outputs.tag }}" >/dev/null; then
            echo "Release tag ${{ steps.release.outputs.tag }} already exists" >&2
            exit 1
          fi

      - name: Pack CLI candidate once
        id: pack
        shell: bash
        run: |
          mkdir -p release/cli-candidate
          pack_json=$(pnpm --dir ./packages/cli pack --json --pack-destination "${PWD}/release/cli-candidate")
          tarball=$(printf '%s' "${pack_json}" | node -e "let d=''; process.stdin.on('data', c => d += c); process.stdin.on('end', () => console.log(JSON.parse(d).filename))")
          integrity=$(node --input-type=module -e "import { createHash } from 'node:crypto'; import { readFileSync } from 'node:fs'; console.log('sha512-' + createHash('sha512').update(readFileSync(process.argv[1])).digest('base64'))" "${tarball}")
          if [ ! -f "${tarball}" ] || [ -z "${integrity}" ]; then
            echo "pnpm pack did not produce one integrity-addressed candidate" >&2
            exit 1
          fi
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"
          echo "integrity=${integrity}" >> "${GITHUB_OUTPUT}"

      - name: Validate packed CLI assets
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          pnpm validate:cli-package -- \
            --tarball "${TARBALL}" \
            --source-package-json packages/cli/package.json

      - name: Publish or reuse immutable CLI candidate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          CANDIDATE_VERSION: ${{ steps.release.outputs.version }}
          ACCEPTANCE_DIST_TAG: ${{ steps.release.outputs.acceptance_tag }}
          PACKED_INTEGRITY: ${{ steps.pack.outputs.integrity }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret is required for publishing" >&2
            exit 1
          fi
          tarball="${TARBALL}"
          registry_integrity=$(npm view "${PACKAGE_NAME}@${CANDIDATE_VERSION}" dist.integrity --json 2>/dev/null | node -e "let d=''; process.stdin.on('data', c => d += c); process.stdin.on('end', () => { try { const v=JSON.parse(d); console.log(typeof v === 'string' ? v : '') } catch { console.log('') } })")
          if [ -z "${registry_integrity}" ]; then
            pnpm publish "${tarball}" --access public --tag "${ACCEPTANCE_DIST_TAG}"
          elif [ "${registry_integrity}" != "${PACKED_INTEGRITY}" ]; then
            mkdir -p release/cli-registry
            registry_pack_json=$(npm pack "${PACKAGE_NAME}@${CANDIDATE_VERSION}" --json --pack-destination release/cli-registry)
            registry_filename=$(printf '%s' "${registry_pack_json}" | node -e "let d=''; process.stdin.on('data', c => d += c); process.stdin.on('end', () => { const v=JSON.parse(d); console.log((Array.isArray(v) ? v[0] : v).filename) })")
            registry_tarball="release/cli-registry/$(basename "${registry_filename}")"
            if [ ! -f "${registry_tarball}" ]; then
              echo "Unable to download the immutable registry candidate" >&2
              exit 1
            fi
            pnpm validate:cli-package -- \
              --tarball "${tarball}" \
              --compare-tarball "${registry_tarball}" \
              --source-package-json packages/cli/package.json
            npm dist-tag add "${PACKAGE_NAME}@${CANDIDATE_VERSION}" "${ACCEPTANCE_DIST_TAG}"
          else
            npm dist-tag add "${PACKAGE_NAME}@${CANDIDATE_VERSION}" "${ACCEPTANCE_DIST_TAG}"
          fi

      - name: Run isolated packaged CLI acceptance
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PREVIOUS_VERSION: ${{ steps.release.outputs.previous_version }}
          CANDIDATE_VERSION: ${{ steps.release.outputs.version }}
          ACCEPTANCE_DIST_TAG: ${{ steps.release.outputs.acceptance_tag }}
        run: |
          pnpm acceptance:cli:update -- \
            --package-name "${PACKAGE_NAME}" \
            --previous-version "${PREVIOUS_VERSION}" \
            --candidate-version "${CANDIDATE_VERSION}" \
            --registry-url "https://registry.npmjs.org/" \
            --dist-tag "${ACCEPTANCE_DIST_TAG}" \
            --commit-sha "${GITHUB_SHA}" \
            --report "release/cli-update-acceptance/report.json"

      - name: Upload packaged CLI acceptance report
        uses: actions/upload-artifact@v4
        with:
          name: cli-update-acceptance-${{ github.sha }}
          path: release/cli-update-acceptance/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove candidate-only npm dist-tag
        if: inputs.promote == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          ACCEPTANCE_DIST_TAG: ${{ steps.release.outputs.acceptance_tag }}
        run: |
          if ! npm dist-tag rm "${PACKAGE_NAME}" "${ACCEPTANCE_DIST_TAG}"; then
            echo "::warning title=Temporary npm dist-tag cleanup failed::${ACCEPTANCE_DIST_TAG} remains on ${PACKAGE_NAME}; npm rejected deletion. Candidate acceptance remains valid."
          fi

      - name: Download required Desktop acceptance report
        if: inputs.promote && inputs.npm_tag == 'latest'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.desktop_acceptance_run_id }}
          pattern: desktop-installed-upgrade-*
          path: release/desktop-acceptance-reports
          merge-multiple: true

      - name: Validate required Desktop acceptance report
        shell: bash
        run: |
          if [[ "${{ inputs.promote }}" != "true" ]]; then
            exit 0
          fi
          if [[ "${{ inputs.npm_tag }}" != "latest" ]]; then
            exit 0
          fi
          if [[ -z "${{ inputs.desktop_acceptance_run_id }}" ]]; then
            echo "latest promotion requires a Desktop acceptance workflow run ID" >&2
            exit 1
          fi
          CANDIDATE_VERSION="${{ steps.release.outputs.version }}" node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from "node:fs";
          import { join } from "node:path";
          const root = "release/desktop-acceptance-reports";
          const parseJson = (path) => {
            const text = readFileSync(path, "utf8");
            return JSON.parse(text.charCodeAt(0) === 0xfeff ? text.slice(1) : text);
          };
          const reports = readdirSync(root, { recursive: true })
            .filter((name) => String(name).endsWith(".json"))
            .map((name) => parseJson(join(root, String(name))));
          const releaseKinds = new Set(reports.map((report) => report.releaseKind));
          if (releaseKinds.size !== 1) throw new Error("Desktop reports do not agree on releaseKind");
          const releaseKind = [...releaseKinds][0];
          if (releaseKind !== "full" && releaseKind !== "runtime-only" && releaseKind !== "migration") {
            throw new Error(`Desktop report releaseKind is invalid: ${releaseKind}`);
          }
          const bootstrap = reports.length === 2 && reports.every((report) => report.scenario === "fresh-native" || report.scenario === "fresh-wsl");
          if (bootstrap && releaseKind !== "full") {
            throw new Error("Fresh Desktop acceptance must use a full release");
          }
          const required = new Set(bootstrap
            ? ["fresh-native", "fresh-wsl"]
            : releaseKind === "full"
              ? ["combined", "wsl-combined", "runtime-health-rollback", "interrupted-download", "restart-journal-recovery", "external-sidecar-browser"]
              : releaseKind === "migration"
                ? ["legacy-current", "legacy-wsl-current", "fresh-native", "fresh-wsl", "external-sidecar-browser"]
                : ["runtime-only", "wsl", "runtime-health-rollback", "interrupted-download", "restart-journal-recovery", "fresh-wsl", "external-sidecar-browser"]);
          for (const report of reports) {
            if (report.commitSha !== process.env.GITHUB_SHA) throw new Error("Desktop report commitSha does not match");
            if (report.releaseKind !== releaseKind) throw new Error("Desktop report releaseKind does not match");
            if (!report.scenario.startsWith("legacy-") && report.scenario !== "external-sidecar-browser" && report.scenario !== "runtime-health-rollback" && report.actualRuntimeVersion !== process.env.CANDIDATE_VERSION) {
              throw new Error("Desktop report product version does not match CLI candidate");
            }
            if (report.scenario === "runtime-health-rollback" && (!report.rollbackRuntimeVersion || report.actualRuntimeVersion !== report.rollbackRuntimeVersion || report.actualRuntimeVersion === process.env.CANDIDATE_VERSION)) {
              throw new Error("Desktop Runtime rollback report does not prove fallback to the previous Runtime");
            }
            if ((report.scenario === "fresh-wsl" || report.scenario === "wsl" || report.scenario === "wsl-combined") && report.wslRuntimeVersion !== process.env.CANDIDATE_VERSION) {
              throw new Error("Desktop WSL report does not match the shared Web product version");
            }
            if (report.scenario === "legacy-wsl-current" && report.wslRuntimeVersion !== report.actualRuntimeVersion) {
              throw new Error("Frozen legacy WSL report changed Runtime version");
            }
            if (!report.channelSignatureDigest) throw new Error("Desktop report channelSignatureDigest is missing");
            required.delete(report.scenario);
          }
          if (required.size) throw new Error(`Desktop acceptance reports are missing: ${[...required].join(", ")}`);
          NODE

      - name: Preserve Desktop update channel assets
        if: inputs.promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p desktop-channel-assets
          latest_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          test -n "${latest_tag}"
          gh release download "${latest_tag}" --dir desktop-channel-assets --clobber
          test -f desktop-channel-assets/desktop-channel.json
          test -f desktop-channel-assets/build-info.json

      - name: Promote accepted CLI dist-tag
        if: inputs.promote
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          CANDIDATE_VERSION: ${{ steps.release.outputs.version }}
          ACCEPTANCE_DIST_TAG: ${{ steps.release.outputs.acceptance_tag }}
          FINAL_DIST_TAG: ${{ inputs.npm_tag }}
        run: |
          npm dist-tag add "${PACKAGE_NAME}@${CANDIDATE_VERSION}" "${FINAL_DIST_TAG}"
          if ! npm dist-tag rm "${PACKAGE_NAME}" "${ACCEPTANCE_DIST_TAG}"; then
            echo "::warning title=Temporary npm dist-tag cleanup failed::${ACCEPTANCE_DIST_TAG} remains on ${PACKAGE_NAME}; npm rejected deletion. The ${FINAL_DIST_TAG} promotion remains valid."
          fi

      - name: Create and push release tag
        if: inputs.promote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}"

      - name: Create GitHub release
        if: inputs.promote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          desktop_assets=()
          while IFS= read -r -d '' asset; do
            desktop_assets+=("${asset}")
          done < <(find desktop-channel-assets -maxdepth 1 -type f -print0)
          release_notes_file="docs/promotion/releases/${{ steps.release.outputs.tag }}.md"

          if [ -f "${release_notes_file}" ]; then
            gh release create "${{ steps.release.outputs.tag }}" \
              "${desktop_assets[@]}" \
              --title "@spencer-kit/coder-studio ${{ steps.release.outputs.version }}" \
              --notes-file "${release_notes_file}" \
              --verify-tag
          else
            gh release create "${{ steps.release.outputs.tag }}" \
              "${desktop_assets[@]}" \
              --title "@spencer-kit/coder-studio ${{ steps.release.outputs.version }}" \
              --generate-notes \
              --verify-tag
          fi
