name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Biome quality
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Changed-file quality check
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACMR "origin/${{ github.base_ref }}"...HEAD)
          else
            before_sha="${{ github.event.before }}"
            if [ "$before_sha" = "0000000000000000000000000000000000000000" ]; then
              mapfile -d '' files < <(git ls-files -z)
            else
              mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACMR "$before_sha" HEAD)
            fi
          fi

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed files to check"
            exit 0
          fi

          pnpm exec biome check --diagnostic-level=error --max-diagnostics=none --no-errors-on-unmatched "${files[@]}"
