name: Product and Desktop compatibility acceptance

on:
  workflow_call:
    inputs:
      product_tag:
        type: string
        required: true
      product_channel_sha256:
        type: string
        required: true
      windows_manifest_sha256:
        type: string
        required: true
      linux_manifest_sha256:
        type: string
        required: true
      desktop_tag:
        type: string
        required: true
      desktop_channel_sha256:
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.target }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [native, wsl]
    steps:
      - name: Download immutable Product and Desktop metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_TAG: ${{ inputs.product_tag }}
          DESKTOP_TAG: ${{ inputs.desktop_tag }}
          DESKTOP_CHANNEL_SHA256: ${{ inputs.desktop_channel_sha256 }}
        run: |
          mkdir -p release/compatibility/product release/compatibility/desktop
          gh release download "${PRODUCT_TAG}" \
            --pattern product-channel.json \
            --pattern coder-studio-runtime-win32-x64.manifest.json \
            --pattern coder-studio-server-runtime-linux-x64.manifest.json \
            --dir release/compatibility/product
          gh release download "${DESKTOP_TAG}" \
            --pattern desktop-channel.json \
            --pattern desktop-channel-modern.json \
            --dir release/compatibility/desktop

          accepted_channel=""
          for candidate in \
            release/compatibility/desktop/desktop-channel.json \
            release/compatibility/desktop/desktop-channel-modern.json; do
            [[ -f "${candidate}" ]] || continue
            candidate_digest=$(sha256sum "${candidate}" | cut -d ' ' -f 1)
            if [[ "${candidate_digest}" == "${DESKTOP_CHANNEL_SHA256}" ]]; then
              accepted_channel="${candidate}"
              break
            fi
          done
          if [[ -z "${accepted_channel}" ]]; then
            echo "No Desktop channel asset matches the accepted digest" >&2
            exit 1
          fi
          cp "${accepted_channel}" release/compatibility/desktop/desktop-channel.accepted.json
          mv release/compatibility/desktop/desktop-channel.accepted.json \
            release/compatibility/desktop/desktop-channel.json

      - name: Verify accepted channel and manifest digests
        env:
          PRODUCT_CHANNEL_SHA256: ${{ inputs.product_channel_sha256 }}
          WINDOWS_MANIFEST_SHA256: ${{ inputs.windows_manifest_sha256 }}
          LINUX_MANIFEST_SHA256: ${{ inputs.linux_manifest_sha256 }}
          DESKTOP_CHANNEL_SHA256: ${{ inputs.desktop_channel_sha256 }}
        run: |
          cd release/compatibility
          printf '%s  %s\n' "${PRODUCT_CHANNEL_SHA256}" product/product-channel.json | sha256sum --check --strict
          printf '%s  %s\n' "${WINDOWS_MANIFEST_SHA256}" product/coder-studio-runtime-win32-x64.manifest.json | sha256sum --check --strict
          printf '%s  %s\n' "${LINUX_MANIFEST_SHA256}" product/coder-studio-server-runtime-linux-x64.manifest.json | sha256sum --check --strict
          printf '%s  %s\n' "${DESKTOP_CHANNEL_SHA256}" desktop/desktop-channel.json | sha256sum --check --strict

      - name: Verify Product Runtime and Desktop Shell capability tuple
        env:
          PRODUCT_TAG: ${{ inputs.product_tag }}
          DESKTOP_TAG: ${{ inputs.desktop_tag }}
          TARGET: ${{ matrix.target }}
          PRODUCT_CHANNEL_SHA256: ${{ inputs.product_channel_sha256 }}
          WINDOWS_MANIFEST_SHA256: ${{ inputs.windows_manifest_sha256 }}
          LINUX_MANIFEST_SHA256: ${{ inputs.linux_manifest_sha256 }}
          DESKTOP_CHANNEL_SHA256: ${{ inputs.desktop_channel_sha256 }}
        run: |
          mkdir -p release/compatibility-report
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const readJson = (path) => JSON.parse(readFileSync(path, "utf8"));
          const product = readJson("release/compatibility/product/product-channel.json");
          const desktop = readJson("release/compatibility/desktop/desktop-channel.json");
          const target = process.env.TARGET;
          const runtimeTarget = target === "wsl" ? "linux-x64" : "win32-x64";
          const manifestName = target === "wsl"
            ? "coder-studio-server-runtime-linux-x64.manifest.json"
            : "coder-studio-runtime-win32-x64.manifest.json";
          const manifest = readJson(`release/compatibility/product/${manifestName}`);
          const compareVersions = (left, right) => {
            const parts = (value) => String(value).split(/[.+-]/u).map((part) => Number.parseInt(part, 10) || 0);
            const a = parts(left);
            const b = parts(right);
            for (let index = 0; index < Math.max(a.length, b.length); index += 1) {
              if ((a[index] ?? 0) !== (b[index] ?? 0)) return (a[index] ?? 0) - (b[index] ?? 0);
            }
            return 0;
          };

          if (product.channel !== "product" || product.releaseTag !== process.env.PRODUCT_TAG) {
            throw new Error("Product channel does not match the explicit immutable release tag");
          }
          if (desktop.channel !== "desktop" || desktop.releaseTag !== process.env.DESKTOP_TAG) {
            throw new Error("Desktop channel does not match the explicit immutable release tag");
          }
          if (product.runtimes?.[runtimeTarget]?.manifest !== manifestName) {
            throw new Error(`Product channel does not identify the ${runtimeTarget} manifest`);
          }
          const expectedManifestSha256 = target === "wsl"
            ? process.env.LINUX_MANIFEST_SHA256
            : process.env.WINDOWS_MANIFEST_SHA256;
          if (product.runtimes[runtimeTarget].manifestSha256 !== expectedManifestSha256) {
            throw new Error(`Product channel ${runtimeTarget} manifestSha256 differs from accepted bytes`);
          }
          if (manifest.runtimeVersion !== product.version) {
            throw new Error("Product Runtime version does not match the Product channel");
          }
          if (compareVersions(desktop.shell.version, product.minShellVersion) < 0) {
            throw new Error("Desktop Shell is older than the Product minimum Shell version");
          }
          const expected = {
            requiredEngineVersion: desktop.shell.engineVersion,
            requiredNodeVersion: desktop.shell.nodeVersion,
            runtimeHostApiVersion: desktop.shell.runtimeHostApiVersion,
            apiProtocolVersion: desktop.shell.apiProtocolVersion,
            dataSchemaVersion: desktop.shell.dataSchemaVersion,
          };
          for (const [field, value] of Object.entries(expected)) {
            if (manifest[field] !== value) {
              throw new Error(`${target} Product Runtime ${field} is incompatible with Desktop`);
            }
          }
          const channelRequirements = {
            requiredEngineVersion: product.requirements.engineVersion,
            requiredNodeVersion: product.requirements.nodeVersion,
            runtimeHostApiVersion: product.requirements.runtimeHostApiVersion,
            apiProtocolVersion: product.requirements.apiProtocolVersion,
            dataSchemaVersion: product.requirements.dataSchemaVersion,
          };
          if (JSON.stringify(channelRequirements) !== JSON.stringify(expected)) {
            throw new Error("Product channel requirements are incompatible with Desktop");
          }

          writeFileSync(
            `release/compatibility-report/${target}.json`,
            `${JSON.stringify({
              schemaVersion: 1,
              target,
              product: {
                version: product.version,
                tag: process.env.PRODUCT_TAG,
                channelSha256: process.env.PRODUCT_CHANNEL_SHA256,
                manifestSha256: target === "wsl"
                  ? process.env.LINUX_MANIFEST_SHA256
                  : process.env.WINDOWS_MANIFEST_SHA256,
              },
              desktop: {
                version: desktop.version,
                tag: process.env.DESKTOP_TAG,
                channelSha256: process.env.DESKTOP_CHANNEL_SHA256,
              },
              compatible: true,
            }, null, 2)}\n`,
            "utf8"
          );
          NODE

      - name: Upload compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-report-${{ matrix.target }}-${{ github.sha }}
          path: release/compatibility-report/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 30
