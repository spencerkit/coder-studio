name: Publish Desktop

on:
  push:
    branches: [main]
    paths:
      - packages/desktop/package.json
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "Existing immutable Desktop candidate tag to resume"
        required: false
        default: ""
        type: string
      windows_signing:
        description: "Require Windows Authenticode signing for workflow_dispatch runs"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Desktop release identity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      candidate_tag: ${{ steps.release.outputs.candidate_tag }}
      resume_candidate: ${{ steps.release.outputs.resume_candidate }}
      published_at: ${{ steps.release.outputs.published_at }}
      previous_desktop_tag: ${{ steps.stable.outputs.desktop_tag }}
      previous_desktop_version: ${{ steps.stable.outputs.desktop_version }}
      previous_desktop_channel_sha256: ${{ steps.stable.outputs.desktop_channel_sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main and a release-ready tree
        run: |
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Desktop publication must run from main" >&2
            exit 1
          fi
          pending_changesets=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md')
          if [[ -n "${pending_changesets}" ]]; then
            echo "Pending changesets exist. Merge the generated release PR first." >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release validation
        run: pnpm ci:release:validate

      - name: Resolve immutable Desktop identity
        id: release
        env:
          REQUESTED_CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          version=$(node -p "require('./packages/desktop/package.json').version")
          expected_tag="desktop-v${version}"
          candidate_tag="${REQUESTED_CANDIDATE_TAG:-${expected_tag}}"
          if [[ "${candidate_tag}" != "${expected_tag}" ]]; then
            echo "Desktop candidate tag must be the final immutable identity ${expected_tag}" >&2
            exit 1
          fi
          resume_candidate=false
          if [[ -n "${REQUESTED_CANDIDATE_TAG}" ]]; then
            resume_candidate=true
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "candidate_tag=${candidate_tag}" >> "${GITHUB_OUTPUT}"
          echo "resume_candidate=${resume_candidate}" >> "${GITHUB_OUTPUT}"
          echo "published_at=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" >> "${GITHUB_OUTPUT}"

      - name: Resolve current stable Desktop identity
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release/stable-desktop
          if ! gh release download desktop-stable \
            --pattern desktop-channel.json \
            --dir release/stable-desktop 2>/dev/null; then
            fallback_desktop_tag=$(gh release list --limit 100 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[] | select(.tagName | startswith("desktop-v")) | .tagName' | head -n 1)
            if [[ -z "${fallback_desktop_tag}" ]]; then
              echo "No stable Desktop release is available for Desktop publication" >&2
              exit 1
            fi
            gh release download "${fallback_desktop_tag}" \
              --pattern desktop-channel.json \
              --pattern desktop-channel-modern.json \
              --dir release/stable-desktop
            accepted_desktop_channel=""
            for candidate in \
              release/stable-desktop/desktop-channel-modern.json \
              release/stable-desktop/desktop-channel.json; do
              [[ -f "${candidate}" ]] || continue
              candidate_tag=$(node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(typeof value.releaseTag === 'string' ? value.releaseTag : '')" "${candidate}")
              if [[ "${candidate_tag}" == "${fallback_desktop_tag}" ]]; then
                accepted_desktop_channel="${candidate}"
                break
              fi
            done
            if [[ -z "${accepted_desktop_channel}" ]]; then
              echo "No Desktop channel asset matches the fallback release tag ${fallback_desktop_tag}" >&2
              exit 1
            fi
          else
            accepted_desktop_channel="release/stable-desktop/desktop-channel.json"
          fi
          desktop_digest=$(sha256sum "${accepted_desktop_channel}" | cut -d ' ' -f 1)
          desktop_tag=$(node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(typeof value.releaseTag === 'string' ? value.releaseTag : '')" "${accepted_desktop_channel}")
          desktop_version=$(node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); const version=value?.version ?? value?.shell?.version; process.stdout.write(typeof version === 'string' ? version : '')" "${accepted_desktop_channel}")
          echo "desktop_channel_sha256=${desktop_digest}" >> "${GITHUB_OUTPUT}"
          echo "desktop_tag=${desktop_tag}" >> "${GITHUB_OUTPUT}"
          echo "desktop_version=${desktop_version}" >> "${GITHUB_OUTPUT}"

  resolve-factory-product:
    name: Resolve accepted Factory Product
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: desktop-production
    outputs:
      current_product_tag: ${{ steps.identity.outputs.current_product_tag }}
      current_product_source_asset: ${{ steps.identity.outputs.current_product_source_asset }}
      current_product_source_sha256: ${{ steps.identity.outputs.current_product_source_sha256 }}
      current_product_channel_sha256: ${{ steps.identity.outputs.current_product_channel_sha256 }}
      current_windows_manifest_sha256: ${{ steps.identity.outputs.current_windows_manifest_sha256 }}
      current_linux_manifest_sha256: ${{ steps.identity.outputs.current_linux_manifest_sha256 }}
      current_product_bundle_artifact: ${{ steps.identity.outputs.current_product_bundle_artifact }}
      previous_product_tag: ${{ steps.identity.outputs.previous_product_tag }}
      previous_product_channel_sha256: ${{ steps.identity.outputs.previous_product_channel_sha256 }}
      previous_windows_manifest_sha256: ${{ steps.identity.outputs.previous_windows_manifest_sha256 }}
      previous_linux_manifest_sha256: ${{ steps.identity.outputs.previous_linux_manifest_sha256 }}
      previous_product_bundle_artifact: ${{ steps.identity.outputs.previous_product_bundle_artifact }}
    env:
      GH_TOKEN: ${{ github.token }}
      CODER_STUDIO_RUNTIME_PUBLIC_KEY: ${{ secrets.DESKTOP_RUNTIME_PUBLIC_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build target Desktop metadata
        env:
          CODER_STUDIO_RELEASE_PUBLISHED_AT: ${{ needs.prepare.outputs.published_at }}
        run: pnpm build:desktop

      - name: Resolve Product selected for Factory packaging
        id: product
        env:
          CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
          RESUME_CANDIDATE: ${{ needs.prepare.outputs.resume_candidate }}
        run: |
          if [[ -z "${CODER_STUDIO_RUNTIME_PUBLIC_KEY}" ]]; then
            echo "The production Runtime public key is required" >&2
            exit 1
          fi
          mkdir -p \
            release/factory-resolution/stable \
            release/factory-resolution/desktop \
            release/factory-resolution/keys \
            release/factory-resolution/selection
          printf '%s' "${CODER_STUDIO_RUNTIME_PUBLIC_KEY}" \
            > release/factory-resolution/keys/runtime-public.pem
          selection_source=release/factory-resolution/stable/product-index.json
          selection_source_asset=product-index.json
          if ! gh release download product-stable \
            --pattern "${selection_source_asset}" \
            --dir release/factory-resolution/stable 2>/dev/null; then
            selection_source=release/factory-resolution/stable/product-channel.json
            selection_source_asset=product-channel.json
            gh release download product-stable \
              --pattern "${selection_source_asset}" \
              --dir release/factory-resolution/stable
          fi
          required_version=""
          if [[ "${RESUME_CANDIDATE}" == "true" ]]; then
            gh release download "${CANDIDATE_TAG}" \
              --pattern desktop-channel.json \
              --dir release/factory-resolution/desktop
            required_version=$(node -p "require('./release/factory-resolution/desktop/desktop-channel.json').factoryProduct.version")
          fi
          node --import tsx scripts/select-product-index-release.ts \
            --index "${selection_source}" \
            --build-info packages/desktop/dist/build-info.json \
            --public-key release/factory-resolution/keys/runtime-public.pem \
            --output release/factory-resolution/selection/current.json
          selected_tag=$(node -p "require('./release/factory-resolution/selection/current.json').releaseTag")
          selected_version=$(node -p "require('./release/factory-resolution/selection/current.json').version")
          if [[ -n "${required_version}" && "${required_version}" != "${selected_version}" ]]; then
            echo "Desktop candidate Factory Runtime ${required_version} is no longer the highest compatible accepted Runtime ${selected_version}; publish a new Desktop version" >&2
            exit 1
          fi
          echo "selected_tag=${selected_tag}" >> "${GITHUB_OUTPUT}"
          echo "selected_version=${selected_version}" >> "${GITHUB_OUTPUT}"
          selection_source_sha256=$(sha256sum "${selection_source}" | cut -d ' ' -f 1)
          echo "selection_source=${selection_source}" >> "${GITHUB_OUTPUT}"
          echo "selection_source_asset=${selection_source_asset}" >> "${GITHUB_OUTPUT}"
          echo "selection_source_sha256=${selection_source_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Download and validate accepted Product bundle
        env:
          PRODUCT_TAG: ${{ steps.product.outputs.selected_tag }}
        run: |
          mkdir -p release/factory-resolution/product/current release/factory-resolution/source
          selected=release/factory-resolution/selection/current.json
          windows_manifest=$(node -p "require('./${selected}').runtimes['win32-x64'].manifest")
          linux_manifest=$(node -p "require('./${selected}').runtimes['linux-x64'].manifest")
          gh release download "${PRODUCT_TAG}" \
            --pattern product-channel.json \
            --pattern coder-studio-cli.tgz \
            --pattern "${windows_manifest}" \
            --pattern "${linux_manifest}" \
            --dir release/factory-resolution/product/current
          windows_digest=$(sha256sum "release/factory-resolution/product/current/${windows_manifest}" | cut -d ' ' -f 1)
          linux_digest=$(sha256sum "release/factory-resolution/product/current/${linux_manifest}" | cut -d ' ' -f 1)
          expected_windows_digest=$(node -p "require('./${selected}').runtimes['win32-x64'].manifestSha256")
          expected_linux_digest=$(node -p "require('./${selected}').runtimes['linux-x64'].manifestSha256")
          if [[ "${windows_digest}" != "${expected_windows_digest}" || "${linux_digest}" != "${expected_linux_digest}" ]]; then
            echo "Selected Product Runtime manifest digest does not match the signed Product index" >&2
            exit 1
          fi
          windows_package=$(node -p "require('./release/factory-resolution/product/current/${windows_manifest}').packageFile")
          linux_package=$(node -p "require('./release/factory-resolution/product/current/${linux_manifest}').packageFile")
          gh release download "${PRODUCT_TAG}" \
            --pattern "${windows_package}" \
            --pattern "${linux_package}" \
            --dir release/factory-resolution/product/current
          tar -xOf release/factory-resolution/product/current/coder-studio-cli.tgz package/package.json \
            > release/factory-resolution/source/current-package.json
          pnpm release:artifacts validate-product \
            --directory release/factory-resolution/product/current \
            --source-package-json release/factory-resolution/source/current-package.json
          resolved_tag=$(node -p "require('./release/factory-resolution/product/current/product-channel.json').releaseTag")
          resolved_version=$(node -p "require('./release/factory-resolution/product/current/product-channel.json').version")
          selected_version=$(node -p "require('./${selected}').version")
          if [[ "${resolved_tag}" != "${PRODUCT_TAG}" || "${resolved_version}" != "${selected_version}" ]]; then
            echo "Accepted Product channel does not match the signed Product index selection" >&2
            exit 1
          fi

      - name: Extract accepted Factory Runtime and provenance
        run: |
          mkdir -p release/factory-product/factory-runtime
          manifest_name=$(node -p "require('./release/factory-resolution/product/current/product-channel.json').runtimes['win32-x64'].manifest")
          package_name=$(node -p "require('./release/factory-resolution/product/current/' + '${manifest_name}').packageFile")
          tar -xzf "release/factory-resolution/product/current/${package_name}" \
            -C release/factory-product/factory-runtime
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const channel = JSON.parse(readFileSync("release/factory-resolution/product/current/product-channel.json", "utf8"));
          writeFileSync("release/factory-product/factory-product.json", `${JSON.stringify({
            schemaVersion: 1,
            version: channel.version,
            releaseTag: channel.releaseTag,
            runtimes: {
              "win32-x64": {
                manifest: channel.runtimes["win32-x64"].manifest,
                manifestSha256: channel.runtimes["win32-x64"].manifestSha256,
              },
              "linux-x64": {
                manifest: channel.runtimes["linux-x64"].manifest,
                manifestSha256: channel.runtimes["linux-x64"].manifestSha256,
              },
            },
          }, null, 2)}\n`);
          NODE
          selected_version=$(node -p "require('./release/factory-resolution/selection/current.json').version")
          factory_version=$(node -p "require('./release/factory-product/factory-product.json').version")
          packaged_runtime_version=$(node -p "require('./release/factory-product/factory-runtime/manifest.json').runtimeVersion")
          if [[ "${selected_version}" != "${factory_version}" || \
                "${selected_version}" != "${packaged_runtime_version}" ]]; then
            echo "Factory Runtime does not match the signed Product index selection" >&2
            exit 1
          fi

      - name: Resolve current and previous Product compatibility identities
        id: identity
        env:
          CURRENT_PRODUCT_TAG: ${{ steps.product.outputs.selected_tag }}
          PRODUCT_SOURCE: ${{ steps.product.outputs.selection_source }}
          PRODUCT_SOURCE_ASSET: ${{ steps.product.outputs.selection_source_asset }}
          PRODUCT_SOURCE_SHA256: ${{ steps.product.outputs.selection_source_sha256 }}
        run: |
          current_channel=release/factory-resolution/product/current/product-channel.json
          current_channel_digest=$(sha256sum "${current_channel}" | cut -d ' ' -f 1)
          current_windows_digest=$(node -p "require('./${current_channel}').runtimes['win32-x64'].manifestSha256")
          current_linux_digest=$(node -p "require('./${current_channel}').runtimes['linux-x64'].manifestSha256")

          download_product_bundle() {
            local selection=$1
            local bundle=$2
            local source_package=$3
            local product_tag windows_manifest linux_manifest
            product_tag=$(node -p "require('./${selection}').releaseTag") || return 1
            windows_manifest=$(node -p "require('./${selection}').runtimes['win32-x64'].manifest") || return 1
            linux_manifest=$(node -p "require('./${selection}').runtimes['linux-x64'].manifest") || return 1
            mkdir -p "${bundle}"
            gh release download "${product_tag}" \
              --pattern product-channel.json \
              --pattern coder-studio-cli.tgz \
              --pattern "${windows_manifest}" \
              --pattern "${linux_manifest}" \
              --dir "${bundle}" || return 1
            local windows_digest linux_digest expected_windows_digest expected_linux_digest
            windows_digest=$(sha256sum "${bundle}/${windows_manifest}" | cut -d ' ' -f 1) || return 1
            linux_digest=$(sha256sum "${bundle}/${linux_manifest}" | cut -d ' ' -f 1) || return 1
            expected_windows_digest=$(node -p "require('./${selection}').runtimes['win32-x64'].manifestSha256") || return 1
            expected_linux_digest=$(node -p "require('./${selection}').runtimes['linux-x64'].manifestSha256") || return 1
            if [[ "${windows_digest}" != "${expected_windows_digest}" || \
                  "${linux_digest}" != "${expected_linux_digest}" ]]; then
              return 1
            fi
            local windows_package linux_package
            windows_package=$(node -p "require('./${bundle}/${windows_manifest}').packageFile") || return 1
            linux_package=$(node -p "require('./${bundle}/${linux_manifest}').packageFile") || return 1
            gh release download "${product_tag}" \
              --pattern "${windows_package}" \
              --pattern "${linux_package}" \
              --dir "${bundle}" || return 1
            tar -xOf "${bundle}/coder-studio-cli.tgz" package/package.json > "${source_package}" || return 1
            pnpm release:artifacts validate-product \
              --directory "${bundle}" \
              --source-package-json "${source_package}" || return 1
            local declared_tag declared_version selected_version
            declared_tag=$(node -p "require('./${bundle}/product-channel.json').releaseTag") || return 1
            declared_version=$(node -p "require('./${bundle}/product-channel.json').version") || return 1
            selected_version=$(node -p "require('./${selection}').version") || return 1
            [[ "${declared_tag}" == "${product_tag}" && "${declared_version}" == "${selected_version}" ]]
          }

          current_version=$(node -p "require('./release/factory-resolution/selection/current.json').version")
          if [[ "${PRODUCT_SOURCE_ASSET}" == "product-index.json" ]]; then
            node --import tsx scripts/select-product-index-release.ts \
              --index "${PRODUCT_SOURCE}" \
              --build-info packages/desktop/dist/build-info.json \
              --public-key release/factory-resolution/keys/runtime-public.pem \
              --previous-to-version "${current_version}" \
              --output release/factory-resolution/selection/previous.json
            if ! download_product_bundle \
              release/factory-resolution/selection/previous.json \
              release/factory-resolution/product/previous \
              release/factory-resolution/source/previous-package.json; then
              echo "Previous Product selected by the signed index is not a complete valid bundle" >&2
              exit 1
            fi
          else
            mkdir -p \
              release/factory-resolution/selection/previous-candidates \
              release/factory-resolution/product/previous-candidates
            mapfile -t product_tags < <(
              gh release list --limit 100 --exclude-drafts --exclude-pre-releases --json tagName \
                --jq '.[].tagName' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -Vr
            )
            previous_product_tag=""
            for candidate_tag in "${product_tags[@]}"; do
              candidate_source="release/factory-resolution/selection/previous-candidates/${candidate_tag}/product-channel.json"
              candidate_selection="release/factory-resolution/selection/previous-candidates/${candidate_tag}.json"
              candidate_bundle="release/factory-resolution/product/previous-candidates/${candidate_tag}"
              mkdir -p "$(dirname "${candidate_source}")"
              if ! gh release download "${candidate_tag}" \
                --pattern product-channel.json \
                --dir "$(dirname "${candidate_source}")" 2>/dev/null; then
                continue
              fi
              if ! node --import tsx scripts/select-product-index-release.ts \
                --index "${candidate_source}" \
                --build-info packages/desktop/dist/build-info.json \
                --public-key release/factory-resolution/keys/runtime-public.pem \
                --output "${candidate_selection}"; then
                continue
              fi
              candidate_version=$(node -p "require('./${candidate_selection}').version")
              if [[ "${candidate_version}" == "${current_version}" || \
                    "$(printf '%s\n%s\n' "${candidate_version}" "${current_version}" | sort -V | head -n 1)" != "${candidate_version}" ]]; then
                continue
              fi
              if download_product_bundle \
                "${candidate_selection}" \
                "${candidate_bundle}" \
                "release/factory-resolution/source/previous-${candidate_tag}-package.json"; then
                cp "${candidate_selection}" release/factory-resolution/selection/previous.json
                mkdir -p release/factory-resolution/product/previous
                cp -R "${candidate_bundle}/." release/factory-resolution/product/previous/
                previous_product_tag="${candidate_tag}"
                break
              fi
            done
            if [[ -z "${previous_product_tag}" ]]; then
              echo "No earlier compatible Product release has a complete valid bundle" >&2
              exit 1
            fi
          fi

          previous_product_tag=$(node -p "require('./release/factory-resolution/selection/previous.json').releaseTag")
          previous_windows_manifest=$(node -p "require('./release/factory-resolution/selection/previous.json').runtimes['win32-x64'].manifest")
          previous_linux_manifest=$(node -p "require('./release/factory-resolution/selection/previous.json').runtimes['linux-x64'].manifest")
          previous_windows_digest=$(sha256sum "release/factory-resolution/product/previous/${previous_windows_manifest}" | cut -d ' ' -f 1)
          previous_linux_digest=$(sha256sum "release/factory-resolution/product/previous/${previous_linux_manifest}" | cut -d ' ' -f 1)
          previous_channel_digest=$(sha256sum release/factory-resolution/product/previous/product-channel.json | cut -d ' ' -f 1)
          echo "current_product_tag=${CURRENT_PRODUCT_TAG}" >> "${GITHUB_OUTPUT}"
          echo "current_product_source_asset=${PRODUCT_SOURCE_ASSET}" >> "${GITHUB_OUTPUT}"
          echo "current_product_source_sha256=${PRODUCT_SOURCE_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "current_product_channel_sha256=${current_channel_digest}" >> "${GITHUB_OUTPUT}"
          echo "current_windows_manifest_sha256=${current_windows_digest}" >> "${GITHUB_OUTPUT}"
          echo "current_linux_manifest_sha256=${current_linux_digest}" >> "${GITHUB_OUTPUT}"
          echo "current_product_bundle_artifact=accepted-product-current-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "previous_product_tag=${previous_product_tag}" >> "${GITHUB_OUTPUT}"
          echo "previous_product_channel_sha256=${previous_channel_digest}" >> "${GITHUB_OUTPUT}"
          echo "previous_windows_manifest_sha256=${previous_windows_digest}" >> "${GITHUB_OUTPUT}"
          echo "previous_linux_manifest_sha256=${previous_linux_digest}" >> "${GITHUB_OUTPUT}"
          echo "previous_product_bundle_artifact=accepted-product-previous-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Upload accepted current Product bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.current_product_bundle_artifact }}
          path: release/factory-resolution/product/current/
          if-no-files-found: error
          retention-days: 14

      - name: Upload accepted previous Product bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.previous_product_bundle_artifact }}
          path: release/factory-resolution/product/previous/
          if-no-files-found: error
          retention-days: 14

      - name: Upload accepted Factory Product
        uses: actions/upload-artifact@v4
        with:
          name: factory-product-${{ github.sha }}
          path: release/factory-product/
          if-no-files-found: error
          retention-days: 14

  windows-assets:
    name: Build signed Windows Desktop assets
    needs:
      - prepare
      - resolve-factory-product
    runs-on: windows-latest
    timeout-minutes: 60
    environment: desktop-production
    env:
      GH_TOKEN: ${{ github.token }}
      WINDOWS_SIGNING_ENABLED: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_signing }}
      CSC_LINK: ${{ (github.event_name != 'workflow_dispatch' || inputs.windows_signing) && secrets.DESKTOP_WINDOWS_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ (github.event_name != 'workflow_dispatch' || inputs.windows_signing) && secrets.DESKTOP_WINDOWS_CSC_KEY_PASSWORD || '' }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ (github.event_name != 'workflow_dispatch' || inputs.windows_signing) && 'true' || 'false' }}
      CODER_STUDIO_RELEASE_PUBLISHED_AT: ${{ needs.prepare.outputs.published_at }}
      CODER_STUDIO_RUNTIME_PUBLIC_KEY: ${{ secrets.DESKTOP_RUNTIME_PUBLIC_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download accepted Factory Product
        uses: actions/download-artifact@v4
        with:
          name: factory-product-${{ github.sha }}
          path: release/factory-product

      - name: Build or recover Windows Desktop bytes
        shell: bash
        env:
          CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
          RESUME_CANDIDATE: ${{ needs.prepare.outputs.resume_candidate }}
        run: |
          if [[ "${RESUME_CANDIDATE}" == "true" ]]; then
            mkdir -p release/desktop-windows
            gh release download "${CANDIDATE_TAG}" \
              --pattern latest.yml \
              --pattern 'Coder-Studio-Setup-*.exe' \
              --pattern 'Coder-Studio-Setup-*.exe.blockmap' \
              --pattern build-info.json \
              --pattern factory-product.json \
              --pattern desktop-validation-evidence.tgz \
              --dir release/desktop-windows
            if tar -tzf release/desktop-windows/desktop-validation-evidence.tgz \
              | grep -Eq '(^|/)factory-runtime(/|$)'; then
              echo "Legacy Desktop candidate evidence contains Factory Runtime bytes" >&2
              exit 1
            fi
            tar -xzf release/desktop-windows/desktop-validation-evidence.tgz \
              -C release/desktop-windows
            cp -R release/factory-product/factory-runtime release/desktop-windows/factory-runtime
          else
            if [[ "${WINDOWS_SIGNING_ENABLED}" == "true" ]]; then
              if [[ -z "${CSC_LINK}" || -z "${CSC_KEY_PASSWORD}" ]]; then
                echo "Windows Authenticode signing credentials are required when windows_signing is enabled" >&2
                exit 1
              fi
            fi
            export CODER_STUDIO_FACTORY_RUNTIME_DIR="${PWD}/release/factory-product/factory-runtime"
            export CODER_STUDIO_FACTORY_PRODUCT_FILE="${PWD}/release/factory-product/factory-product.json"
            pnpm dist:desktop
            pnpm smoke:desktop
            pnpm release:artifacts stage-desktop \
              --directory release/desktop-windows \
              --components windows
          fi

      - name: Verify Authenticode signatures
        if: needs.prepare.outputs.resume_candidate != 'true' && (github.event_name != 'workflow_dispatch' || inputs.windows_signing)
        shell: pwsh
        run: |
          $metadata = Get-Content release/desktop/latest.yml -Raw
          $installerName = [regex]::Match($metadata, '(?m)^path:\s*(.+?)\s*$').Groups[1].Value.Trim('"', "'")
          $paths = @(
            (Join-Path release/desktop $installerName),
            'release/desktop/win-unpacked/Coder Studio.exe',
            'release/desktop/win-unpacked/resources/engine/node.exe'
          )
          foreach ($path in $paths) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for ${path}: $($signature.Status)"
            }
          }

      - name: Upload Windows Desktop candidate
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ github.sha }}
          path: release/desktop-windows/
          if-no-files-found: error
          retention-days: 14

  wsl-engine:
    name: Build signed WSL Engine
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: desktop-production
    env:
      GH_TOKEN: ${{ github.token }}
      CODER_STUDIO_RELEASE_PUBLISHED_AT: ${{ needs.prepare.outputs.published_at }}
      CODER_STUDIO_RUNTIME_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_RUNTIME_SIGNING_PRIVATE_KEY }}
      CODER_STUDIO_RUNTIME_PUBLIC_KEY: ${{ secrets.DESKTOP_RUNTIME_PUBLIC_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build or recover WSL Engine bytes
        env:
          CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
          RESUME_CANDIDATE: ${{ needs.prepare.outputs.resume_candidate }}
        run: |
          mkdir -p release/desktop-wsl
          if [[ "${RESUME_CANDIDATE}" == "true" ]]; then
            gh release download "${CANDIDATE_TAG}" \
              --pattern coder-studio-engine-linux-x64.manifest.json \
              --pattern 'coder-studio-engine-*-linux-x64.tgz' \
              --dir release/desktop-wsl
          else
            if [[ -z "${CODER_STUDIO_RUNTIME_SIGNING_PRIVATE_KEY}" || -z "${CODER_STUDIO_RUNTIME_PUBLIC_KEY}" ]]; then
              echo "Desktop Engine signing credentials are required" >&2
              exit 1
            fi
            pnpm build:wsl-engine
            pnpm release:artifacts stage-desktop \
              --directory release/desktop-wsl \
              --components wsl-engine
          fi

      - name: Upload WSL Engine candidate
        uses: actions/upload-artifact@v4
        with:
          name: desktop-wsl-${{ github.sha }}
          path: release/desktop-wsl/
          if-no-files-found: error
          retention-days: 14

  publish-candidate:
    name: Publish immutable Desktop candidate
    needs:
      - prepare
      - resolve-factory-product
      - windows-assets
      - wsl-engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: desktop-production
    permissions:
      attestations: write
      contents: write
      id-token: write
    outputs:
      candidate_tag: ${{ steps.identity.outputs.candidate_tag }}
      desktop_channel_sha256: ${{ steps.identity.outputs.desktop_channel_sha256 }}
      artifact_digests: ${{ steps.identity.outputs.artifact_digests }}
      candidate_commit: ${{ steps.identity.outputs.candidate_commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      CODER_STUDIO_RUNTIME_PUBLIC_KEY: ${{ secrets.DESKTOP_RUNTIME_PUBLIC_KEY }}
      CODER_STUDIO_RUNTIME_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_RUNTIME_SIGNING_PRIVATE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Windows Desktop assets
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-${{ github.sha }}
          path: release/desktop-candidate

      - name: Download WSL Engine assets
        uses: actions/download-artifact@v4
        with:
          name: desktop-wsl-${{ github.sha }}
          path: release/desktop-candidate

      - name: Assemble or recover signed Desktop bundle
        env:
          CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
          PUBLISHED_AT: ${{ needs.prepare.outputs.published_at }}
          RESUME_CANDIDATE: ${{ needs.prepare.outputs.resume_candidate }}
        run: |
          mkdir -p release/desktop-signing release/desktop-public
          if [[ "${RESUME_CANDIDATE}" == "true" ]]; then
            gh release download "${CANDIDATE_TAG}" \
              --pattern desktop-channel.json \
              --dir release/desktop-candidate
          else
            if [[ -z "${CODER_STUDIO_RUNTIME_SIGNING_PRIVATE_KEY}" || -z "${CODER_STUDIO_RUNTIME_PUBLIC_KEY}" ]]; then
              echo "Production channel signing credentials are required" >&2
              exit 1
            fi
            printf '%s' "${CODER_STUDIO_RUNTIME_SIGNING_PRIVATE_KEY}" \
              > release/desktop-signing/runtime-private.pem
            pnpm release:channel desktop \
              --directory release/desktop-candidate \
              --release-tag "${CANDIDATE_TAG}" \
              --generated-at "${PUBLISHED_AT}" \
              --private-key release/desktop-signing/runtime-private.pem \
              --factory-product factory-product.json
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
              -czf release/desktop-candidate/desktop-validation-evidence.tgz \
              -C release/desktop-candidate windows-engine
          fi
          pnpm release:artifacts validate-desktop \
            --directory release/desktop-candidate
          find release/desktop-candidate -maxdepth 1 -type f -exec cp '{}' release/desktop-public/ \;

      - name: Create or verify immutable Desktop prerelease
        env:
          CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "${CANDIDATE_TAG}" >/dev/null 2>&1; then
            mkdir -p release/existing-desktop-candidate
            gh release download "${CANDIDATE_TAG}" --dir release/existing-desktop-candidate
            node --import tsx scripts/release-workflow-helpers.ts compare-assets \
              --channel desktop \
              --expected-root release/desktop-public \
              --actual-root release/existing-desktop-candidate
          else
            gh release create "${CANDIDATE_TAG}" release/desktop-public/* \
              --target "${GITHUB_SHA}" \
              --title "Coder Studio Desktop ${DESKTOP_VERSION}" \
              --generate-notes \
              --prerelease --latest=false
          fi

      - name: Attest Desktop release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/desktop-public/*

      - name: Stage runtime public key for compatibility acceptance
        run: |
          if [[ -z "${CODER_STUDIO_RUNTIME_PUBLIC_KEY}" ]]; then
            echo "CODER_STUDIO_RUNTIME_PUBLIC_KEY is required" >&2
            exit 1
          fi
          mkdir -p release/compatibility-key
          printf '%s' "${CODER_STUDIO_RUNTIME_PUBLIC_KEY}" \
            > release/compatibility-key/runtime-public.pem

      - name: Upload runtime public key for compatibility acceptance
        uses: actions/upload-artifact@v4
        with:
          name: desktop-compatibility-runtime-public-key-${{ github.run_id }}
          path: release/compatibility-key/runtime-public.pem
          if-no-files-found: error
          retention-days: 1

      - name: Record accepted Desktop candidate identity
        id: identity
        env:
          CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
        run: |
          candidate_commit=$(gh release view "${CANDIDATE_TAG}" --json targetCommitish --jq .targetCommitish)
          if [[ ! "${candidate_commit}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            candidate_commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${candidate_commit}" --jq .sha)
          fi
          node --import tsx scripts/release-workflow-helpers.ts write-candidate-outputs \
            --channel desktop \
            --candidate-root release/desktop-public \
            --output-file "${GITHUB_OUTPUT}" \
            --candidate-tag "${CANDIDATE_TAG}" \
            --candidate-commit "${candidate_commit}"

      - name: Retain accepted Desktop candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: desktop-candidate-${{ github.sha }}
          path: release/desktop-public/
          if-no-files-found: error
          retention-days: 30

  accept-installation:
    name: Accept Desktop installation (${{ matrix.scenario }})
    needs:
      - prepare
      - publish-candidate
    runs-on: windows-latest
    timeout-minutes: 90
    environment: desktop-production
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh-native, fresh-wsl, installed-upgrade]
    env:
      GH_TOKEN: ${{ github.token }}
      CODER_STUDIO_RUNTIME_PUBLIC_KEY: ${{ secrets.DESKTOP_RUNTIME_PUBLIC_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download immutable current and previous Desktop releases
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/desktop-acceptance/candidate -Force | Out-Null
          New-Item -ItemType Directory -Path release/desktop-acceptance/previous -Force | Out-Null
          New-Item -ItemType Directory -Path release/desktop-acceptance/stable-pointer -Force | Out-Null
          gh release download '${{ needs.publish-candidate.outputs.candidate_tag }}' `
            --pattern desktop-channel.json `
            --pattern latest.yml `
            --pattern modern.yml `
            --pattern 'Coder-Studio-Setup-*.exe' `
            --dir release/desktop-acceptance/candidate
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download immutable Desktop candidate' }
          $stableDigest = ''
          gh release download desktop-stable `
            --pattern desktop-channel.json `
            --dir release/desktop-acceptance/stable-pointer
          if ($LASTEXITCODE -eq 0) {
            $stableDigest = (Get-FileHash release/desktop-acceptance/stable-pointer/desktop-channel.json -Algorithm SHA256).Hash.ToLowerInvariant()
          } else {
            $stableDigest = '${{ needs.prepare.outputs.previous_desktop_channel_sha256 }}'
          }
          gh release download '${{ needs.prepare.outputs.previous_desktop_tag }}' `
            --pattern desktop-channel.json `
            --pattern desktop-channel-modern.json `
            --pattern latest.yml `
            --pattern modern.yml `
            --pattern 'Coder-Studio-Setup-*.exe' `
            --dir release/desktop-acceptance/previous
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download previous stable Desktop release' }
          $acceptedAsset = $null
          foreach ($asset in @('desktop-channel.json', 'desktop-channel-modern.json')) {
            $path = Join-Path 'release/desktop-acceptance/previous' $asset
            if ((Test-Path $path) -and (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -eq $stableDigest) {
              $acceptedAsset = $asset
              break
            }
          }
          if (-not $acceptedAsset) { throw 'No immutable previous Desktop channel matches the accepted stable pointer' }
          if ($acceptedAsset -ne 'desktop-channel.json') {
            Copy-Item `
              (Join-Path 'release/desktop-acceptance/previous' $acceptedAsset) `
              release/desktop-acceptance/previous/desktop-channel.json `
              -Force
          }
          $acceptedAsset | Set-Content release/desktop-acceptance/previous/channel-asset.txt -NoNewline

      - name: Resolve installed acceptance identity
        id: identity
        shell: pwsh
        run: |
          if (-not $env:CODER_STUDIO_RUNTIME_PUBLIC_KEY) {
            throw 'Desktop Runtime public key is required for installed acceptance'
          }
          New-Item -ItemType Directory -Path release/desktop-acceptance/key -Force | Out-Null
          $env:CODER_STUDIO_RUNTIME_PUBLIC_KEY | Set-Content release/desktop-acceptance/key/runtime-public.pem -NoNewline
          $candidateRoot = 'release/desktop-acceptance/candidate'
          $previousRoot = 'release/desktop-acceptance/previous'
          $candidate = Get-Content "$candidateRoot/desktop-channel.json" -Raw | ConvertFrom-Json
          $previous = Get-Content "$previousRoot/desktop-channel.json" -Raw | ConvertFrom-Json
          $candidateMetadataAsset = [string]$candidate.shell.updaterMetadata
          if (-not $candidateMetadataAsset) { throw 'Candidate Desktop channel did not declare updater metadata' }
          $candidateMetadata = Get-Content (Join-Path $candidateRoot $candidateMetadataAsset) -Raw
          $previousMetadataAsset = [string]$previous.shell.updaterMetadata
          if (-not $previousMetadataAsset) { throw 'Previous Desktop channel did not declare updater metadata' }
          $previousMetadata = Get-Content (Join-Path $previousRoot $previousMetadataAsset) -Raw
          $candidateInstaller = [regex]::Match($candidateMetadata, '(?m)^path:\s*(.+?)\s*$').Groups[1].Value.Trim('"', "'")
          $previousInstaller = [regex]::Match($previousMetadata, '(?m)^path:\s*(.+?)\s*$').Groups[1].Value.Trim('"', "'")
          $scenario = if ('${{ matrix.scenario }}' -eq 'installed-upgrade') { 'combined' } else { '${{ matrix.scenario }}' }
          $components = if ('${{ matrix.scenario }}' -eq 'installed-upgrade') { 'shell,runtime:win32-x64' } else { '' }
          $previousRuntime = [string]$previous.factoryProduct.version
          if (-not $previousRuntime -and $previous.runtimes.'win32-x64') {
            $previousRuntime = [string]$previous.runtimes.'win32-x64'.version
          }
          if (-not $previousRuntime) { throw 'Unable to resolve previous stable Desktop Runtime version' }
          $targetRuntime = [string]$candidate.factoryProduct.version
          if (-not $targetRuntime -and $candidate.runtimes.'win32-x64') {
            $targetRuntime = [string]$candidate.runtimes.'win32-x64'.version
          }
          if (-not $targetRuntime) { throw 'Unable to resolve target Desktop Runtime version' }
          $signatureBytes = [Text.Encoding]::UTF8.GetBytes([string]$candidate.signature.value)
          $signatureDigest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($signatureBytes)).ToLowerInvariant()
          "scenario=$scenario" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "components=$components" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "candidate_installer=$candidateRoot/$candidateInstaller" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "previous_installer=$previousRoot/$previousInstaller" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "previous_shell=$($previous.shell.version)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "previous_runtime=$previousRuntime" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "target_shell=$($candidate.shell.version)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "target_runtime=$targetRuntime" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "signature_digest=$signatureDigest" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify accepted Desktop channel digest
        shell: bash
        run: |
          actual=$(sha256sum release/desktop-acceptance/candidate/desktop-channel.json | cut -d ' ' -f 1)
          if [[ "${actual}" != "${{ needs.publish-candidate.outputs.desktop_channel_sha256 }}" ]]; then
            echo "Desktop acceptance channel digest mismatch" >&2
            exit 1
          fi

      - name: Prepare disposable WSL distribution
        if: matrix.scenario == 'fresh-wsl'
        id: wsl
        shell: pwsh
        run: |
          $distro = "coder-studio-acceptance-desktop-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          wsl.exe --install -d Ubuntu --no-launch
          wsl.exe -d Ubuntu -u root -- true
          wsl.exe --export Ubuntu "${env:RUNNER_TEMP}\ubuntu-rootfs.tar"
          wsl.exe --import $distro "${env:RUNNER_TEMP}\$distro" "${env:RUNNER_TEMP}\ubuntu-rootfs.tar" --version 2
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create disposable Desktop acceptance WSL distribution' }
          wsl.exe -d $distro -u root -- sh -lc "useradd --create-home --shell /bin/bash coderstudio && printf '[boot]\nsystemd=false\n[user]\ndefault=coderstudio\n' > /etc/wsl.conf"
          wsl.exe --terminate $distro
          "name=$distro" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run immutable installed Desktop acceptance
        shell: pwsh
        run: |
          $previousRuntime = '${{ steps.identity.outputs.previous_runtime }}'
          if (-not $previousRuntime) { throw 'Previous Runtime version is required for Desktop acceptance' }
          $arguments = @(
            '-PreviousInstaller', '${{ steps.identity.outputs.previous_installer }}',
            '-CandidateInstaller', '${{ steps.identity.outputs.candidate_installer }}',
            '-CandidateTag', '${{ needs.publish-candidate.outputs.candidate_tag }}',
            '-ChannelUrl', 'https://github.com/${{ github.repository }}/releases/download/${{ needs.publish-candidate.outputs.candidate_tag }}/desktop-channel.json',
            '-PreviousShellVersion', '${{ steps.identity.outputs.previous_shell }}',
            '-PreviousRuntimeVersion', $previousRuntime,
            '-ExpectedShellVersion', '${{ steps.identity.outputs.target_shell }}',
            '-ExpectedRuntimeVersion', '${{ steps.identity.outputs.target_runtime }}',
            '-PublicKeyPath', 'release/desktop-acceptance/key/runtime-public.pem',
            '-Scenario', '${{ steps.identity.outputs.scenario }}',
            '-ReportPath', 'release/desktop-installation-report/${{ matrix.scenario }}.json',
            '-CommitSha', '${{ github.sha }}',
            '-ChannelSignatureDigest', '${{ steps.identity.outputs.signature_digest }}'
          )
          if ('${{ steps.identity.outputs.components }}') {
            $arguments += @('-ExpectedComponents', '${{ steps.identity.outputs.components }}')
          }
          if ('${{ matrix.scenario }}' -eq 'fresh-wsl') {
            $arguments += @('-WslDistro', '${{ steps.wsl.outputs.name }}')
          }
          if ('${{ github.event_name == 'workflow_dispatch' && !inputs.windows_signing }}' -eq 'true') {
            $arguments += '-SkipAuthenticode'
          }
          pnpm acceptance:desktop:installed @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Immutable installed Desktop acceptance failed' }

      - name: Upload Desktop installation acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installation-${{ matrix.scenario }}-${{ github.sha }}
          path: release/desktop-installation-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Clean up disposable WSL distribution
        if: always() && matrix.scenario == 'fresh-wsl'
        shell: pwsh
        run: |
          $distro = '${{ steps.wsl.outputs.name }}'
          if ($distro) { wsl.exe --unregister $distro 2>$null }

  accept-factory:
    name: Accept packaged Factory Runtime (${{ matrix.scenario }})
    needs:
      - prepare
      - resolve-factory-product
      - publish-candidate
    runs-on: windows-latest
    timeout-minutes: 45
    environment: desktop-production
    strategy:
      fail-fast: false
      matrix:
        scenario: [offline-factory, factory-fallback]
    env:
      GH_TOKEN: ${{ github.token }}
      CODER_STUDIO_RUNTIME_PUBLIC_KEY: ${{ secrets.DESKTOP_RUNTIME_PUBLIC_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download accepted Product bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.resolve-factory-product.outputs.current_product_bundle_artifact }}
          path: release/factory-acceptance/product

      - name: Download and validate immutable Product and Desktop bytes
        shell: pwsh
        env:
          CANDIDATE_TAG: ${{ needs.publish-candidate.outputs.candidate_tag }}
          DESKTOP_CHANNEL_SHA256: ${{ needs.publish-candidate.outputs.desktop_channel_sha256 }}
          PRODUCT_TAG: ${{ needs.resolve-factory-product.outputs.current_product_tag }}
          PRODUCT_CHANNEL_SHA256: ${{ needs.resolve-factory-product.outputs.current_product_channel_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CODER_STUDIO_RUNTIME_PUBLIC_KEY) { throw 'Desktop Runtime public key is required' }
          $root = [System.IO.Path]::GetFullPath('release/factory-acceptance')
          $candidate = Join-Path $root 'candidate'
          $product = Join-Path $root 'product'
          $source = Join-Path $root 'source'
          New-Item -ItemType Directory -Path $candidate, $product, $source -Force | Out-Null

          gh release download $env:CANDIDATE_TAG --dir $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download immutable Desktop candidate bytes' }
          $desktopChannelPath = Join-Path $candidate 'desktop-channel.json'
          $desktopChannelDigest = (Get-FileHash $desktopChannelPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($desktopChannelDigest -ne ([string]$env:DESKTOP_CHANNEL_SHA256).ToLowerInvariant()) {
            throw 'Immutable Desktop channel digest differs from the accepted candidate identity'
          }

          $productChannelPath = Join-Path $product 'product-channel.json'
          if (-not (Test-Path $productChannelPath)) {
            throw 'Accepted Product bundle is missing product-channel.json'
          }
          $productChannelDigest = (Get-FileHash $productChannelPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($productChannelDigest -ne ([string]$env:PRODUCT_CHANNEL_SHA256).ToLowerInvariant()) {
            throw 'Immutable Product channel digest differs from the accepted Factory identity'
          }

          tar -xzf (Join-Path $product 'coder-studio-cli.tgz') `
            -C $source package/package.json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to extract immutable Product CLI manifest' }
          pnpm release:artifacts validate-product `
            --directory $product `
            --source-package-json (Join-Path $source 'package/package.json')
          if ($LASTEXITCODE -ne 0) { throw 'Immutable Factory Product validation failed' }

          $desktopChannel = Get-Content (Join-Path $candidate 'desktop-channel.json') -Raw | ConvertFrom-Json
          $factoryProduct = Get-Content (Join-Path $candidate 'factory-product.json') -Raw | ConvertFrom-Json
          $productChannel = Get-Content $productChannelPath -Raw | ConvertFrom-Json
          $factoryTag = [string]$desktopChannel.factoryProduct.releaseTag
          if (
            -not $factoryTag -or
            $factoryTag -ne $env:PRODUCT_TAG -or
            $factoryProduct.releaseTag -ne $factoryTag
          ) {
            throw 'Factory Product provenance differs from the signed Desktop channel'
          }
          if ($productChannel.releaseTag -ne $factoryTag -or $productChannel.version -ne $factoryProduct.version) {
            throw 'Immutable Product release differs from Factory Product provenance'
          }
          $manifestName = [string]$factoryProduct.runtimes.'win32-x64'.manifest
          $manifestPath = Join-Path $product $manifestName
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Path (Join-Path $candidate 'factory-runtime') -Force | Out-Null
          tar -xzf (Join-Path $product $manifest.packageFile) `
            -C (Join-Path $candidate 'factory-runtime')
          if ($LASTEXITCODE -ne 0) { throw 'Unable to extract immutable Factory Runtime bytes' }
          tar -xzf (Join-Path $candidate 'desktop-validation-evidence.tgz') -C $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Unable to extract immutable Desktop validation evidence' }
          pnpm release:artifacts validate-desktop --directory $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Immutable Desktop candidate validation failed' }

      - name: Verify offline Factory startup and fallback
        shell: pwsh
        env:
          SCENARIO: ${{ matrix.scenario }}
          CANDIDATE_TAG: ${{ needs.publish-candidate.outputs.candidate_tag }}
          DESKTOP_CHANNEL_SHA256: ${{ needs.publish-candidate.outputs.desktop_channel_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CODER_STUDIO_RUNTIME_PUBLIC_KEY) { throw 'Desktop Runtime public key is required' }
          $root = [System.IO.Path]::GetFullPath('release/factory-acceptance')
          $candidate = Join-Path $root 'candidate'
          $metadata = Get-Content (Join-Path $candidate 'latest.yml') -Raw
          $installerName = [regex]::Match($metadata, '(?m)^path:\s*(.+?)\s*$').Groups[1].Value.Trim('"', "'")
          $installRoot = Join-Path $root "install-$env:SCENARIO"
          $userData = Join-Path $root "user-$env:SCENARIO"
          $reportRoot = Join-Path $root 'reports'
          $desktopOut = Join-Path $root "$env:SCENARIO.desktop.stdout.log"
          $desktopErr = Join-Path $root "$env:SCENARIO.desktop.stderr.log"
          $evidenceRoot = Join-Path $reportRoot "$env:SCENARIO.evidence"
          New-Item -ItemType Directory -Path $installRoot, $userData, $reportRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null

          function Copy-AcceptanceEvidence {
            $sources = [System.Collections.Generic.List[string]]::new()
            foreach ($source in @($desktopOut, $desktopErr)) {
              if ($source -and (Test-Path -LiteralPath $source -PathType Leaf)) {
                $sources.Add([System.IO.Path]::GetFullPath($source))
              }
            }
            if (Test-Path -LiteralPath $userData -PathType Container) {
              Get-ChildItem -LiteralPath $userData -Recurse -File -ErrorAction SilentlyContinue | Where-Object {
                $_.Name -match '(?i)(update|electron).*\.log$' -or
                $_.Name -in @('main.log', 'backend.log')
              } | ForEach-Object {
                $sources.Add($_.FullName)
              }
            }

            $copied = [System.Collections.Generic.List[string]]::new()
            $seen = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            $index = 0
            foreach ($source in $sources) {
              if (-not $seen.Add($source)) { continue }
              $index += 1
              $destination = Join-Path $evidenceRoot ('{0:D2}-{1}' -f $index, [System.IO.Path]::GetFileName($source))
              Copy-Item -LiteralPath $source -Destination $destination -Force
              $copied.Add([System.IO.Path]::GetFullPath($destination))
            }
            return @($copied)
          }

          function Write-AcceptanceReport([bool]$Accepted, [string]$Failure = '') {
            $report = [ordered]@{
              schemaVersion = 1
              scenario = $env:SCENARIO
              candidateTag = $env:CANDIDATE_TAG
              desktopChannelSha256 = $env:DESKTOP_CHANNEL_SHA256
              factoryProductTag = $packagedProduct.releaseTag
              factoryManifestSha256 = $packagedManifest.Hash.ToLowerInvariant()
              offline = $true
              accepted = $Accepted
              failure = $Failure
              evidence = @(Copy-AcceptanceEvidence)
            }
            if ($process) {
              $report.processExited = $process.HasExited
              $report.processExitCode = if ($process.HasExited) { $process.ExitCode } else { $null }
            }
            $report | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $reportRoot "$env:SCENARIO.json") -Encoding utf8
          }

          function Write-LogTail([string]$Path, [string]$Label) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { return }
            Write-Host "::group::$Label"
            Get-Content -LiteralPath $Path -Tail 200
            Write-Host '::endgroup::'
          }

          $installer = Start-Process -FilePath (Join-Path $candidate $installerName) -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Desktop installer exited with $($installer.ExitCode)" }

          $resources = Join-Path $installRoot 'resources'
          $packagedFactoryRoot = Join-Path $resources 'factory-runtime'
          $acceptedFactoryRoot = Join-Path $candidate 'factory-runtime'
          function Get-RelativeFiles([string]$path) {
            $resolved = (Resolve-Path -LiteralPath $path).Path
            @(
              Get-ChildItem -LiteralPath $resolved -Recurse -File |
                ForEach-Object {
                  [System.IO.Path]::GetRelativePath($resolved, $_.FullName).Replace('\', '/')
                } |
                Sort-Object
            )
          }
          $packagedFiles = @(Get-RelativeFiles $packagedFactoryRoot)
          $acceptedFiles = @(Get-RelativeFiles $acceptedFactoryRoot)
          $fileSetDifference = Compare-Object `
            -ReferenceObject $acceptedFiles `
            -DifferenceObject $packagedFiles `
            -CaseSensitive
          if ($fileSetDifference) {
            throw 'Packaged Factory Runtime file set differs from accepted Product bytes'
          }
          foreach ($relativePath in $acceptedFiles) {
            $packagedPath = Join-Path $packagedFactoryRoot $relativePath
            $acceptedPath = Join-Path $acceptedFactoryRoot $relativePath
            $packagedFile = Get-Item -LiteralPath $packagedPath
            $acceptedFile = Get-Item -LiteralPath $acceptedPath
            $packagedHash = (Get-FileHash $packagedPath -Algorithm SHA256).Hash
            $acceptedHash = (Get-FileHash $acceptedPath -Algorithm SHA256).Hash
            if ($packagedFile.Length -ne $acceptedFile.Length -or $packagedHash -ne $acceptedHash) {
              throw "Packaged Factory Runtime file differs from accepted Product bytes: $relativePath"
            }
          }
          $packagedManifest = Get-FileHash (Join-Path $packagedFactoryRoot 'manifest.json') -Algorithm SHA256
          $packagedProduct = Get-Content (Join-Path $resources 'factory-product.json') -Raw | ConvertFrom-Json
          $channel = Get-Content (Join-Path $candidate 'desktop-channel.json') -Raw | ConvertFrom-Json
          if ($packagedProduct.releaseTag -ne $channel.factoryProduct.releaseTag) { throw 'Packaged Factory Product provenance differs from the signed Desktop channel' }

          if ($env:SCENARIO -eq 'factory-fallback') {
            $store = Join-Path $userData 'runtime-store'
            New-Item -ItemType Directory -Path (Join-Path $store 'versions/111111111111111111111111') -Force | Out-Null
            @{
              active = @{
                id = '111111111111111111111111'
                runtimeVersion = '999.0.0'
                installedAt = [DateTime]::UtcNow.ToString('o')
              }
            } | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $store 'active.json') -Encoding utf8
          }

          $port = 9333 + [Array]::IndexOf(@('offline-factory', 'factory-fallback'), $env:SCENARIO)
          $env:CODER_STUDIO_DESKTOP_ACCEPTANCE = '1'
          $env:CODER_STUDIO_PRODUCT_CHANNEL_URL = 'http://127.0.0.1:1/product-channel.json'
          $env:CODER_STUDIO_DESKTOP_CHANNEL_URL = 'http://127.0.0.1:1/desktop-channel.json'
          $env:CODER_STUDIO_RELEASE_BASE_URL = 'https://github.com/${{ github.repository }}/releases/download/${{ needs.publish-candidate.outputs.candidate_tag }}/'
          $env:CODER_STUDIO_FACTORY_RELEASE_BASE_URL = 'http://127.0.0.1:1/'
          $env:CODER_STUDIO_DESKTOP_PUBLIC_KEY_FILE = Join-Path $root 'runtime-public.pem'
          $env:CODER_STUDIO_RUNTIME_PUBLIC_KEY | Set-Content $env:CODER_STUDIO_DESKTOP_PUBLIC_KEY_FILE -NoNewline
          $executable = Join-Path $installRoot 'Coder Studio.exe'
          $process = $null
          $process = Start-Process -FilePath $executable -ArgumentList @(
            "--remote-debugging-port=$port",
            "--user-data-dir=$userData",
            "--coder-studio-environment-root=$userData",
            '--coder-studio-environment-target=native'
          ) -PassThru -RedirectStandardOutput $desktopOut -RedirectStandardError $desktopErr
          $process.Handle | Out-Null
          try {
            $ready = $false
            $deadline = [DateTime]::UtcNow.AddSeconds(120)
            while ([DateTime]::UtcNow -lt $deadline) {
              if ($process.HasExited) { break }
              try {
                $pages = Invoke-RestMethod -Uri "http://127.0.0.1:$port/json" -TimeoutSec 2
                if ($pages.Count -gt 0) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) {
              if ($process.HasExited) {
                Write-Host "Desktop process exit code: $($process.ExitCode)"
              }
              Write-LogTail $desktopOut 'Desktop stdout'
              Write-LogTail $desktopErr 'Desktop stderr'
              Write-AcceptanceReport $false 'Desktop did not start from the offline Factory Runtime'
              throw 'Desktop did not start from the offline Factory Runtime'
            }
            if ($env:SCENARIO -eq 'factory-fallback' -and (Test-Path (Join-Path $userData 'runtime-store/active.json'))) {
              Write-AcceptanceReport $false 'Invalid active Runtime pointer did not fall back to the Factory Runtime'
              throw 'Invalid active Runtime pointer did not fall back to the Factory Runtime'
            }
            Write-AcceptanceReport $true
          } finally {
            if ($process) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload Factory Runtime acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-factory-${{ matrix.scenario }}-${{ github.sha }}
          path: release/factory-acceptance/reports/
          if-no-files-found: warn
          retention-days: 30

  compatibility:
    name: Accept Desktop with ${{ matrix.product }} Product
    needs:
      - prepare
      - resolve-factory-product
      - publish-candidate
    strategy:
      matrix:
        product: [current, previous]
    uses: ./.github/workflows/compatibility-acceptance.yml
    with:
      product_tag: ${{ matrix.product == 'current' && needs.resolve-factory-product.outputs.current_product_tag || needs.resolve-factory-product.outputs.previous_product_tag }}
      product_channel_sha256: ${{ matrix.product == 'current' && needs.resolve-factory-product.outputs.current_product_channel_sha256 || needs.resolve-factory-product.outputs.previous_product_channel_sha256 }}
      windows_manifest_sha256: ${{ matrix.product == 'current' && needs.resolve-factory-product.outputs.current_windows_manifest_sha256 || needs.resolve-factory-product.outputs.previous_windows_manifest_sha256 }}
      linux_manifest_sha256: ${{ matrix.product == 'current' && needs.resolve-factory-product.outputs.current_linux_manifest_sha256 || needs.resolve-factory-product.outputs.previous_linux_manifest_sha256 }}
      product_bundle_artifact: ${{ matrix.product == 'current' && needs.resolve-factory-product.outputs.current_product_bundle_artifact || needs.resolve-factory-product.outputs.previous_product_bundle_artifact }}
      desktop_tag: ${{ needs.publish-candidate.outputs.candidate_tag }}
      desktop_channel_sha256: ${{ needs.publish-candidate.outputs.desktop_channel_sha256 }}
      runtime_public_key_artifact: desktop-compatibility-runtime-public-key-${{ github.run_id }}

  promote:
    name: Promote accepted Desktop
    needs:
      - prepare
      - resolve-factory-product
      - publish-candidate
      - accept-installation
      - accept-factory
      - compatibility
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: product-desktop-stable-promotion
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
      CANDIDATE_TAG: ${{ needs.publish-candidate.outputs.candidate_tag }}
      DESKTOP_CHANNEL_SHA256: ${{ needs.publish-candidate.outputs.desktop_channel_sha256 }}
      ARTIFACT_DIGESTS: ${{ needs.publish-candidate.outputs.artifact_digests }}
      PREVIOUS_POINTER_DIGEST: ${{ needs.prepare.outputs.previous_desktop_channel_sha256 }}
      ACCEPTED_PRODUCT_SOURCE_ASSET: ${{ needs.resolve-factory-product.outputs.current_product_source_asset }}
      ACCEPTED_PRODUCT_SOURCE_SHA256: ${{ needs.resolve-factory-product.outputs.current_product_source_sha256 }}
      ACCEPTED_PRODUCT_CHANNEL_SHA256: ${{ needs.resolve-factory-product.outputs.current_product_channel_sha256 }}
      CANDIDATE_COMMIT: ${{ needs.publish-candidate.outputs.candidate_commit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download accepted current Product bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.resolve-factory-product.outputs.current_product_bundle_artifact }}
          path: release/desktop-promotion/current-product

      - name: Revalidate accepted Product stable pointer
        run: |
          mkdir -p release/desktop-promotion/accepted-product
          accepted_product_channel=release/desktop-promotion/current-product/product-channel.json
          case "${ACCEPTED_PRODUCT_SOURCE_ASSET}" in
            product-index.json|product-channel.json) ;;
            *)
              echo "Accepted Product stable source asset is invalid" >&2
              exit 1
              ;;
          esac
          gh release download product-stable \
            --pattern "${ACCEPTED_PRODUCT_SOURCE_ASSET}" \
            --dir release/desktop-promotion/accepted-product
          current_digest=$(sha256sum "${accepted_product_channel}" | cut -d ' ' -f 1)
          current_source_digest=$(sha256sum "release/desktop-promotion/accepted-product/${ACCEPTED_PRODUCT_SOURCE_ASSET}" | cut -d ' ' -f 1)
          if [[ "${current_digest}" != "${ACCEPTED_PRODUCT_CHANNEL_SHA256}" || \
                "${current_source_digest}" != "${ACCEPTED_PRODUCT_SOURCE_SHA256}" ]]; then
            echo "Product stable pointer changed after compatibility acceptance; rerun the candidate acceptance graph" >&2
            exit 1
          fi

      - name: Verify accepted immutable Desktop bytes
        run: |
          mkdir -p release/desktop-promotion/candidate
          gh release download "${CANDIDATE_TAG}" --dir release/desktop-promotion/candidate
          node --import tsx scripts/release-workflow-helpers.ts verify-digests \
            --channel desktop \
            --actual-root release/desktop-promotion/candidate \
            --expected-digests "${ARTIFACT_DIGESTS}"

      - name: Promote Desktop versioned release
        run: gh release edit "${CANDIDATE_TAG}" --prerelease=false --latest=false

      - name: Advance signed Desktop stable pointer
        run: |
          pointer=release/desktop-promotion/candidate/desktop-channel.json
          final_digest=$(sha256sum "${pointer}" | cut -d ' ' -f 1)
          if [[ "${final_digest}" != "${DESKTOP_CHANNEL_SHA256}" ]]; then
            echo "Immutable Desktop digest mismatch: desktop-channel.json" >&2
            exit 1
          fi
          mkdir -p release/desktop-promotion/previous
          current_digest=""
          if gh release download desktop-stable --pattern desktop-channel.json --dir release/desktop-promotion/previous 2>/dev/null; then
            current_digest=$(sha256sum release/desktop-promotion/previous/desktop-channel.json | cut -d ' ' -f 1)
          fi
          if [[ "${current_digest}" != "${PREVIOUS_POINTER_DIGEST}" && "${current_digest}" != "${final_digest}" ]]; then
            echo "Desktop stable pointer changed after acceptance" >&2
            exit 1
          fi
          if gh release view desktop-stable >/dev/null 2>&1; then
            gh release upload desktop-stable "${pointer}" --clobber
          else
            gh release create desktop-stable "${pointer}" \
              --target "${GITHUB_SHA}" \
              --title "Coder Studio Desktop stable channel" \
              --notes "Signed mutable Desktop channel pointer." \
              --latest=false
          fi

      - name: Verify promoted Desktop
        run: |
          mkdir -p release/desktop-promotion/final
          gh release download desktop-stable \
            --pattern desktop-channel.json \
            --dir release/desktop-promotion/final
          final_digest=$(sha256sum release/desktop-promotion/final/desktop-channel.json | cut -d ' ' -f 1)
          final_version=$(node -p "require('./release/desktop-promotion/final/desktop-channel.json').version")
          final_tag=$(node -p "require('./release/desktop-promotion/final/desktop-channel.json').releaseTag")
          if [[ "${final_digest}" != "${DESKTOP_CHANNEL_SHA256}" || "${final_version}" != "${DESKTOP_VERSION}" || "${final_tag}" != "${CANDIDATE_TAG}" ]]; then
            echo "Promoted Desktop stable pointer verification failed" >&2
            exit 1
          fi

      - name: Record Desktop promotion
        run: |
          mkdir -p release/desktop-promotion/record release/desktop-promotion/existing-record
          if gh release download "${CANDIDATE_TAG}" --pattern promotion.json --dir release/desktop-promotion/existing-record 2>/dev/null; then
            node --import tsx scripts/release-workflow-helpers.ts verify-existing-promotion-record \
              --channel desktop \
              --existing-record release/desktop-promotion/existing-record/promotion.json \
              --output-file release/desktop-promotion/record/promotion.json \
              --version "${DESKTOP_VERSION}" \
              --candidate-tag "${CANDIDATE_TAG}" \
              --candidate-commit "${CANDIDATE_COMMIT}" \
              --artifact-digests "${ARTIFACT_DIGESTS}" \
              --final-pointer-digest "${DESKTOP_CHANNEL_SHA256}"
            echo "Existing Desktop promotion record matches the accepted immutable identity"
          else
            node --import tsx scripts/release-workflow-helpers.ts write-promotion-record \
              --channel desktop \
              --workflow desktop-release \
              --output-file release/desktop-promotion/record/promotion.json \
              --version "${DESKTOP_VERSION}" \
              --candidate-tag "${CANDIDATE_TAG}" \
              --candidate-commit "${CANDIDATE_COMMIT}" \
              --artifact-digests "${ARTIFACT_DIGESTS}" \
              --previous-pointer-digest "${PREVIOUS_POINTER_DIGEST}" \
              --final-pointer-digest "${DESKTOP_CHANNEL_SHA256}"
            gh release upload "${CANDIDATE_TAG}" release/desktop-promotion/record/promotion.json
          fi

      - name: Retain Desktop promotion record
        uses: actions/upload-artifact@v4
        with:
          name: desktop-promotion-${{ github.sha }}
          path: release/desktop-promotion/record/promotion.json
          if-no-files-found: error
          retention-days: 90
