name: Publish Desktop acceptance

on:
  workflow_dispatch:
    inputs:
      windows_signing:
        description: "Sign Windows executables with Authenticode"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare acceptance channel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.channel.outputs.release_tag }}
      release_base_url: ${{ steps.channel.outputs.release_base_url }}
      runtime_update_url: ${{ steps.channel.outputs.runtime_update_url }}
      signing_key_artifact: ${{ steps.channel.outputs.signing_key_artifact }}
      public_key_artifact: ${{ steps.channel.outputs.public_key_artifact }}
      has_previous_desktop: ${{ steps.channel.outputs.has_previous_desktop }}
      acceptance_scenarios: ${{ steps.channel.outputs.acceptance_scenarios }}

    steps:
      - name: Resolve acceptance channel
        id: channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="desktop-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}"
          runtime_update_url=${release_base_url}/coder-studio-runtime-win32-x64.manifest.json
          signing_key_artifact="desktop-ci-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          public_key_artifact="desktop-acceptance-public-key-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_base_url=${release_base_url}" >> "${GITHUB_OUTPUT}"
          echo "runtime_update_url=${runtime_update_url}" >> "${GITHUB_OUTPUT}"
          echo "signing_key_artifact=${signing_key_artifact}" >> "${GITHUB_OUTPUT}"
          echo "public_key_artifact=${public_key_artifact}" >> "${GITHUB_OUTPUT}"
          latest_release_json="${RUNNER_TEMP}/coder-studio-latest-release.json"
          latest_release_error="${RUNNER_TEMP}/coder-studio-latest-release-error.log"
          has_previous_desktop=false
          if gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > "${latest_release_json}" 2> "${latest_release_error}"; then
            has_previous_desktop=$(node -e "const release=require(process.argv[1]); process.stdout.write(Array.isArray(release.assets)&&release.assets.some((asset)=>asset?.name==='desktop-channel.json')?'true':'false')" "${latest_release_json}")
          elif ! grep -q '(HTTP 404)' "${latest_release_error}"; then
            cat "${latest_release_error}" >&2
            exit 1
          fi
          if [[ "${has_previous_desktop}" == "true" ]]; then
            acceptance_scenarios='["runtime-only","combined","wsl","wsl-combined","runtime-health-rollback","interrupted-download","restart-journal-recovery","external-sidecar-browser"]'
          else
            acceptance_scenarios='["fresh-native","fresh-wsl"]'
          fi
          echo "has_previous_desktop=${has_previous_desktop}" >> "${GITHUB_OUTPUT}"
          echo "acceptance_scenarios=${acceptance_scenarios}" >> "${GITHUB_OUTPUT}"

      - name: Generate ephemeral Runtime signing key
        shell: bash
        run: |
          mkdir -p release/desktop-ci-signing
          openssl genpkey -algorithm Ed25519 -out release/desktop-ci-signing/runtime-private.pem
          openssl pkey \
            -in release/desktop-ci-signing/runtime-private.pem \
            -pubout \
            -out release/desktop-ci-signing/runtime-public.pem

      - name: Upload ephemeral signing key
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.channel.outputs.signing_key_artifact }}
          path: release/desktop-ci-signing/
          if-no-files-found: error
          retention-days: 1

      - name: Upload acceptance public key
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.channel.outputs.public_key_artifact }}
          path: release/desktop-ci-signing/runtime-public.pem
          if-no-files-found: error
          retention-days: 3

  repository-verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build-assets:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-verify.yml
    with:
      signed: true
      windows_signing: ${{ inputs.windows_signing }}
      signing_key_artifact: ${{ needs.prepare.outputs.signing_key_artifact }}
      runtime_update_url: ${{ needs.prepare.outputs.runtime_update_url }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}
    secrets:
      windows_csc_link: ${{ secrets.DESKTOP_WINDOWS_CSC_LINK }}
      windows_csc_key_password: ${{ secrets.DESKTOP_WINDOWS_CSC_KEY_PASSWORD }}

  publish:
    name: Publish signed Desktop acceptance channel
    needs:
      - prepare
      - repository-verify
      - build-assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      complete_artifact: ${{ needs.build-assets.outputs.complete_artifact }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download complete acceptance bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-assets.outputs.complete_artifact }}
          path: release/desktop-acceptance

      - name: Download acceptance public key
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.public_key_artifact }}
          path: release/desktop-ci-signing

      - name: Load acceptance public key
        shell: bash
        run: |
          {
            echo 'CODER_STUDIO_RUNTIME_PUBLIC_KEY<<PUBLIC_KEY'
            cat release/desktop-ci-signing/runtime-public.pem
            echo 'PUBLIC_KEY'
          } >> "${GITHUB_ENV}"

      - name: Validate complete signed acceptance channel
        run: pnpm desktop:artifacts validate --directory release/desktop-acceptance --components 'desktop,win-runtime,wsl-engine,wsl-runtime' --release-kind full

      - name: Publish tag-pinned prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          desktop_version=$(node -p "require('./packages/desktop/package.json').version")
          installer="Coder-Studio-Setup-${desktop_version}.exe"
          release_error="${RUNNER_TEMP}/desktop-acceptance-release-error.log"
          if existing_is_draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.draft' 2>"${release_error}"); then
            if [[ "${existing_is_draft}" != "true" ]]; then
              echo "Refusing to overwrite non-draft release ${RELEASE_TAG}." >&2
              exit 1
            fi
          elif grep -q '(HTTP 404)' "${release_error}"; then
            windows_signing_note=""
            if [[ "${{ inputs.windows_signing }}" != "true" ]]; then
              windows_signing_note=" WARNING: Windows executables in this acceptance build are not Authenticode-signed."
            fi
            gh release create "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Coder Studio Desktop acceptance ${GITHUB_RUN_NUMBER}" \
              --notes "Ephemeral Runtime-signed acceptance channel for ${GITHUB_SHA}. The Runtime signing key is test-only; do not promote these assets to production.${windows_signing_note}" \
              --draft
          else
            cat "${release_error}" >&2
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" release/desktop-acceptance/* --clobber
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease --latest=false
          {
            echo "## Desktop acceptance channel"
            echo
            echo "- Installer: ${{ needs.prepare.outputs.release_base_url }}/${installer}"
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "- Runtime channel: ${{ needs.prepare.outputs.runtime_update_url }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  installed-upgrades:
    name: Installed Desktop upgrade (${{ matrix.scenario }})
    needs:
      - prepare
      - publish
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.prepare.outputs.acceptance_scenarios) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download complete candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.publish.outputs.complete_artifact }}
          path: release/desktop-installed-candidate

      - name: Download acceptance signing key
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.signing_key_artifact }}
          path: release/desktop-ci-signing

      - name: Download previous stable Desktop release
        if: needs.prepare.outputs.has_previous_desktop == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path release/desktop-installed-previous -Force | Out-Null
          $latestTag = gh api "repos/${env:GITHUB_REPOSITORY}/releases/latest" --jq .tag_name
          if ($LASTEXITCODE -ne 0 -or -not $latestTag) {
            throw 'A previous stable unified Desktop release is required for installed acceptance'
          }
          $patterns = @(
            'latest.yml',
            'Coder-Studio-Setup-*.exe',
            '*.blockmap',
            'build-info.json',
            'desktop-channel.json',
            'coder-studio-engine-linux-x64.manifest.json',
            'coder-studio-engine-*-linux-x64.tgz',
            'coder-studio-runtime-win32-x64.manifest.json',
            'coder-studio-runtime-*-win32-x64.tgz',
            'coder-studio-server-runtime-linux-x64.manifest.json',
            'coder-studio-server-runtime-*-linux-x64.tgz'
          )
          foreach ($pattern in $patterns) {
            gh release download $latestTag --pattern $pattern --dir release/desktop-installed-previous --clobber
            if ($LASTEXITCODE -ne 0) { throw "Previous Desktop asset is missing: $pattern" }
          }

      - name: Prepare scenario-specific signed channel
        id: scenario
        shell: pwsh
        run: |
          $candidate = 'release/desktop-installed-candidate'
          $previous = 'release/desktop-installed-previous'
          $scenario = '${{ matrix.scenario }}'
          $hasPreviousDesktop = '${{ needs.prepare.outputs.has_previous_desktop }}' -eq 'true'
          $originalChannel = Get-Content (Join-Path $candidate 'desktop-channel.json') -Raw | ConvertFrom-Json
          $generatedAt = ([DateTimeOffset]$originalChannel.generatedAt).UtcDateTime.ToString(
            'yyyy-MM-ddTHH:mm:ss.fffZ',
            [Globalization.CultureInfo]::InvariantCulture
          )
          $scenarioTag = "${{ needs.prepare.outputs.release_tag }}-$scenario"
          if ($hasPreviousDesktop -and $scenario -notin @('combined', 'wsl-combined')) {
            pnpm desktop:channel -- --directory $candidate --carry-forward-from $previous
            if ($LASTEXITCODE -ne 0) { throw 'Unable to carry forward the previous Shell for the Runtime-only scenario' }
          }
          pnpm desktop:channel -- `
            --directory $candidate `
            --release-tag $scenarioTag `
            --channel prerelease `
            --generated-at $generatedAt `
            --private-key release/desktop-ci-signing/runtime-private.pem
          if ($LASTEXITCODE -ne 0) { throw 'Unable to build scenario Desktop channel' }
          $env:CODER_STUDIO_RUNTIME_PUBLIC_KEY = Get-Content release/desktop-ci-signing/runtime-public.pem -Raw
          $validation = @(
            'desktop:artifacts', 'validate',
            '--directory', $candidate,
            '--components', 'desktop,win-runtime,wsl-engine,wsl-runtime'
          )
          if (-not $hasPreviousDesktop -or $scenario -in @('combined', 'wsl-combined')) {
            $validation += @('--release-kind', 'full')
          } else {
            $validation += @(
              '--release-kind', 'runtime-only',
              '--previous-release-directory', $previous
            )
          }
          pnpm @validation
          if ($LASTEXITCODE -ne 0) { throw 'Scenario Desktop channel validation failed' }

          $channel = Get-Content (Join-Path $candidate 'desktop-channel.json') -Raw | ConvertFrom-Json
          $candidateMetadata = Get-Content (Join-Path $candidate 'latest.yml') -Raw
          $candidateInstallerName = [regex]::Match($candidateMetadata, '(?m)^path:\s*(.+?)\s*$').Groups[1].Value.Trim('"', "'")
          if ($hasPreviousDesktop) {
            $previousChannel = Get-Content (Join-Path $previous 'desktop-channel.json') -Raw | ConvertFrom-Json
            $previousMetadata = Get-Content (Join-Path $previous 'latest.yml') -Raw
            $previousInstallerName = [regex]::Match($previousMetadata, '(?m)^path:\s*(.+?)\s*$').Groups[1].Value.Trim('"', "'")
            $previousInstaller = "$previous/$previousInstallerName"
            $previousShell = $previousChannel.shell.version
            $previousRuntime = $previousChannel.runtimes.'win32-x64'.version
          } else {
            $previousInstaller = "$candidate/$candidateInstallerName"
            $previousShell = $channel.shell.version
            $previousRuntime = $channel.runtimes.'win32-x64'.version
          }
          $components = if ($scenario -in @('fresh-native', 'fresh-wsl')) {
            ''
          } elseif ($scenario -eq 'combined') {
            'shell,runtime:win32-x64'
          } elseif ($scenario -eq 'wsl-combined') {
            'shell,runtime:win32-x64'
          } elseif ($scenario -eq 'wsl') {
            'runtime:win32-x64'
          } elseif ($scenario -eq 'external-sidecar-browser') {
            ''
          } else {
            'runtime:win32-x64'
          }
          $signatureBytes = [Text.Encoding]::UTF8.GetBytes([string]$channel.signature.value)
          $signatureDigest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($signatureBytes)).ToLowerInvariant()
          $portListener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $portListener.Start()
          $port = ([Net.IPEndPoint]$portListener.LocalEndpoint).Port
          $portListener.Stop()
          $server = Start-Process python -ArgumentList @('-m', 'http.server', $port, '--bind', '127.0.0.1', '--directory', $candidate) -PassThru -WindowStyle Hidden
          $server.Id | Set-Content release/desktop-installed-http.pid
          "channel_url=http://127.0.0.1:$port/desktop-channel.json" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "scenario_tag=$scenarioTag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "candidate_installer=$candidate/$candidateInstallerName" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "previous_installer=$previousInstaller" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "previous_shell=$previousShell" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "previous_runtime=$previousRuntime" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "target_shell=$($channel.shell.version)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "target_runtime=$($channel.runtimes.'win32-x64'.version)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "components=$components" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "signature_digest=$signatureDigest" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Prepare disposable WSL distribution
        if: matrix.scenario == 'fresh-wsl' || matrix.scenario == 'wsl' || matrix.scenario == 'wsl-combined'
        id: wsl
        shell: pwsh
        run: |
          $distro = "coder-studio-acceptance-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          wsl.exe --install -d Ubuntu --no-launch
          wsl.exe -d Ubuntu -u root -- true
          wsl.exe --export Ubuntu "${env:RUNNER_TEMP}\ubuntu-rootfs.tar"
          wsl.exe --import $distro "${env:RUNNER_TEMP}\$distro" "${env:RUNNER_TEMP}\ubuntu-rootfs.tar" --version 2
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create disposable WSL acceptance distribution' }
          "name=$distro" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run installed Desktop update scenario
        shell: pwsh
        run: |
          $arguments = @(
            '-PreviousInstaller', '${{ steps.scenario.outputs.previous_installer }}',
            '-CandidateInstaller', '${{ steps.scenario.outputs.candidate_installer }}',
            '-CandidateTag', '${{ steps.scenario.outputs.scenario_tag }}',
            '-ChannelUrl', '${{ steps.scenario.outputs.channel_url }}',
            '-PreviousShellVersion', '${{ steps.scenario.outputs.previous_shell }}',
            '-PreviousRuntimeVersion', '${{ steps.scenario.outputs.previous_runtime }}',
            '-ExpectedShellVersion', '${{ steps.scenario.outputs.target_shell }}',
            '-ExpectedRuntimeVersion', '${{ steps.scenario.outputs.target_runtime }}',
            '-PublicKeyPath', 'release/desktop-ci-signing/runtime-public.pem',
            '-Scenario', '${{ matrix.scenario }}',
            '-ReportPath', 'release/desktop-installed-report/${{ matrix.scenario }}.json',
            '-CommitSha', '${{ github.sha }}',
            '-ChannelSignatureDigest', '${{ steps.scenario.outputs.signature_digest }}'
          )
          if ('${{ steps.scenario.outputs.components }}') {
            $arguments += @('-ExpectedComponents', '${{ steps.scenario.outputs.components }}')
          }
          if ('${{ matrix.scenario }}' -eq 'runtime-health-rollback') {
            $arguments += @('-ExpectedRuntimeAfterRestart', '${{ steps.scenario.outputs.previous_runtime }}')
          }
          if ('${{ matrix.scenario }}' -in @('fresh-wsl', 'wsl', 'wsl-combined')) {
            $arguments += @('-WslDistro', '${{ steps.wsl.outputs.name }}')
          }
          if ('${{ inputs.windows_signing }}' -ne 'true') {
            $arguments += '-SkipAuthenticode'
          }
          pnpm acceptance:desktop:installed @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Installed Desktop acceptance failed' }

      - name: Upload installed-upgrade report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installed-upgrade-${{ matrix.scenario }}-${{ github.sha }}
          path: release/desktop-installed-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up acceptance services
        if: always()
        shell: pwsh
        run: |
          if (Test-Path release/desktop-installed-http.pid) {
            $serverPid = Get-Content release/desktop-installed-http.pid
            Stop-Process -Id $serverPid -Force -ErrorAction SilentlyContinue
          }
          $distro = '${{ steps.wsl.outputs.name }}'
          if ($distro) { wsl.exe --unregister $distro 2>$null }
