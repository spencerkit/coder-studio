name: Legacy bridge Desktop acceptance

on:
  workflow_dispatch:
    inputs:
      bridge_candidate_tag:
        description: "Existing immutable legacy bridge candidate tag"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: legacy-bridge-acceptance-${{ inputs.bridge_candidate_tag }}
  cancel-in-progress: false

jobs:
  accept:
    name: Accept immutable legacy bridge (${{ matrix.target }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [native, wsl]
    env:
      GH_TOKEN: ${{ github.token }}
      CODER_STUDIO_RUNTIME_PUBLIC_KEY: ${{ secrets.DESKTOP_RUNTIME_PUBLIC_KEY }}
      BRIDGE_CANDIDATE_TAG: ${{ inputs.bridge_candidate_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download current latest and immutable bridge assets
        shell: pwsh
        run: |
          if (-not $env:BRIDGE_CANDIDATE_TAG) { throw 'bridge_candidate_tag is required' }
          if ($env:BRIDGE_CANDIDATE_TAG -in @('product-stable', 'desktop-stable')) {
            throw 'A stable pointer tag cannot be used as a bridge candidate'
          }
          $candidate = gh release view $env:BRIDGE_CANDIDATE_TAG --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $candidate.tagName -ne $env:BRIDGE_CANDIDATE_TAG) {
            throw 'Unable to resolve the immutable bridge candidate'
          }
          if ($candidate.isDraft) { throw 'Bridge acceptance requires a published candidate' }
          $latestTag = gh api "repos/${env:GITHUB_REPOSITORY}/releases/latest" --jq .tag_name
          if ($LASTEXITCODE -ne 0 -or -not $latestTag) {
            throw 'A supported repository-wide latest Desktop release is required'
          }
          if (-not $candidate.isPrerelease -and $latestTag -ne $env:BRIDGE_CANDIDATE_TAG) {
            throw 'A normal bridge release is accepted only when it is repository-wide latest'
          }
          New-Item -ItemType Directory -Force -Path release/legacy-bridge/previous | Out-Null
          New-Item -ItemType Directory -Force -Path release/legacy-bridge/candidate | Out-Null
          gh release download $latestTag `
            --pattern desktop-channel.json `
            --pattern latest.yml `
            --pattern 'Coder-Studio-Setup-*.exe' `
            --dir release/legacy-bridge/previous
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download the supported legacy Desktop' }
          gh release download $env:BRIDGE_CANDIDATE_TAG `
            --pattern desktop-channel.json `
            --pattern latest.yml `
            --pattern 'Coder-Studio-Setup-*.exe' `
            --dir release/legacy-bridge/candidate
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download immutable bridge assets' }

      - name: Resolve tag-pinned legacy acceptance identity
        id: identity
        shell: pwsh
        run: |
          if (-not $env:CODER_STUDIO_RUNTIME_PUBLIC_KEY) {
            throw 'Desktop Runtime public key is required for legacy bridge acceptance'
          }
          New-Item -ItemType Directory -Force -Path release/legacy-bridge/key | Out-Null
          $env:CODER_STUDIO_RUNTIME_PUBLIC_KEY | Set-Content release/legacy-bridge/key/runtime-public.pem -NoNewline
          $previousRoot = 'release/legacy-bridge/previous'
          $candidateRoot = 'release/legacy-bridge/candidate'
          $previous = Get-Content "$previousRoot/desktop-channel.json" -Raw | ConvertFrom-Json
          $candidate = Get-Content "$candidateRoot/desktop-channel.json" -Raw | ConvertFrom-Json
          $expectedTag = "desktop-v$($candidate.shell.version)"
          if ($env:BRIDGE_CANDIDATE_TAG -ne $expectedTag) {
            throw "Bridge candidate tag must match the Desktop identity $expectedTag"
          }
          $previousMetadata = Get-Content "$previousRoot/latest.yml" -Raw
          $candidateMetadata = Get-Content "$candidateRoot/latest.yml" -Raw
          $previousInstaller = [regex]::Match($previousMetadata, '(?m)^path:\s*(.+?)\s*$').Groups[1].Value.Trim('"', "'")
          $candidateInstaller = [regex]::Match($candidateMetadata, '(?m)^path:\s*(.+?)\s*$').Groups[1].Value.Trim('"', "'")
          $alreadyPromoted = $previous.shell.version -eq $candidate.shell.version
          $frozenScenario = if ('${{ matrix.target }}' -eq 'wsl') { 'legacy-wsl-current' } else { 'legacy-current' }
          $scenario = if ($alreadyPromoted) {
            $frozenScenario
          } elseif ('${{ matrix.target }}' -eq 'wsl') {
            'wsl-combined'
          } else {
            'combined'
          }
          $components = if ($alreadyPromoted) { '' } else { 'shell,runtime:win32-x64' }
          $signatureBytes = [Text.Encoding]::UTF8.GetBytes([string]$candidate.signature.value)
          $signatureDigest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($signatureBytes)).ToLowerInvariant()
          "previous_installer=$previousRoot/$previousInstaller" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "candidate_installer=$candidateRoot/$candidateInstaller" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "previous_shell=$($previous.shell.version)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "previous_runtime=$($previous.runtimes.'win32-x64'.version)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "target_shell=$($candidate.shell.version)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "target_runtime=$($candidate.runtimes.'win32-x64'.version)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "scenario=$scenario" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "frozen_scenario=$frozenScenario" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "components=$components" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "signature_digest=$signatureDigest" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Prepare disposable WSL distribution
        if: matrix.target == 'wsl'
        id: wsl
        shell: pwsh
        run: |
          $distro = "coder-studio-acceptance-bridge-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          wsl.exe --install -d Ubuntu --no-launch
          wsl.exe -d Ubuntu -u root -- true
          wsl.exe --export Ubuntu "${env:RUNNER_TEMP}\ubuntu-rootfs.tar"
          wsl.exe --import $distro "${env:RUNNER_TEMP}\$distro" "${env:RUNNER_TEMP}\ubuntu-rootfs.tar" --version 2
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create disposable bridge WSL distribution' }
          wsl.exe -d $distro -u root -- sh -lc "useradd --create-home --shell /bin/bash coderstudio && printf '[boot]\nsystemd=false\n[user]\ndefault=coderstudio\n' > /etc/wsl.conf"
          wsl.exe --terminate $distro
          "name=$distro" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run immutable legacy bridge upgrade
        shell: pwsh
        run: |
          $arguments = @(
            '-PreviousInstaller', '${{ steps.identity.outputs.previous_installer }}',
            '-CandidateInstaller', '${{ steps.identity.outputs.candidate_installer }}',
            '-CandidateTag', '${{ inputs.bridge_candidate_tag }}',
            '-ChannelUrl', 'https://github.com/${{ github.repository }}/releases/download/${{ inputs.bridge_candidate_tag }}/desktop-channel.json',
            '-PreviousShellVersion', '${{ steps.identity.outputs.previous_shell }}',
            '-PreviousRuntimeVersion', '${{ steps.identity.outputs.previous_runtime }}',
            '-ExpectedShellVersion', '${{ steps.identity.outputs.target_shell }}',
            '-ExpectedRuntimeVersion', '${{ steps.identity.outputs.target_runtime }}',
            '-PublicKeyPath', 'release/legacy-bridge/key/runtime-public.pem',
            '-Scenario', '${{ steps.identity.outputs.scenario }}',
            '-ReportPath', 'release/legacy-bridge-report/${{ matrix.target }}.json',
            '-CommitSha', '${{ github.sha }}',
            '-ChannelSignatureDigest', '${{ steps.identity.outputs.signature_digest }}'
          )
          if ('${{ steps.identity.outputs.components }}') {
            $arguments += @('-ExpectedComponents', '${{ steps.identity.outputs.components }}')
          }
          if ('${{ matrix.target }}' -eq 'wsl') {
            $arguments += @('-WslDistro', '${{ steps.wsl.outputs.name }}')
          }
          pnpm acceptance:desktop:installed @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Immutable legacy bridge upgrade failed' }

      - name: Verify the bridge legacy channel remains frozen
        shell: pwsh
        run: |
          $arguments = @(
            '-PreviousInstaller', '${{ steps.identity.outputs.candidate_installer }}',
            '-CandidateInstaller', '${{ steps.identity.outputs.candidate_installer }}',
            '-CandidateTag', '${{ inputs.bridge_candidate_tag }}',
            '-ChannelUrl', 'https://github.com/${{ github.repository }}/releases/download/${{ inputs.bridge_candidate_tag }}/desktop-channel.json',
            '-PreviousShellVersion', '${{ steps.identity.outputs.target_shell }}',
            '-PreviousRuntimeVersion', '${{ steps.identity.outputs.target_runtime }}',
            '-ExpectedShellVersion', '${{ steps.identity.outputs.target_shell }}',
            '-ExpectedRuntimeVersion', '${{ steps.identity.outputs.target_runtime }}',
            '-PublicKeyPath', 'release/legacy-bridge/key/runtime-public.pem',
            '-Scenario', '${{ steps.identity.outputs.frozen_scenario }}',
            '-ReportPath', 'release/legacy-bridge-report/${{ matrix.target }}-frozen.json',
            '-CommitSha', '${{ github.sha }}',
            '-ChannelSignatureDigest', '${{ steps.identity.outputs.signature_digest }}'
          )
          if ('${{ matrix.target }}' -eq 'wsl') {
            $arguments += @('-WslDistro', '${{ steps.wsl.outputs.name }}')
          }
          pnpm acceptance:desktop:installed @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Frozen legacy bridge verification failed' }

      - name: Upload legacy bridge acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-bridge-${{ matrix.target }}-${{ github.sha }}
          path: release/legacy-bridge-report/
          if-no-files-found: warn
          retention-days: 90

      - name: Clean up disposable WSL distribution
        if: always() && matrix.target == 'wsl'
        shell: pwsh
        run: |
          $distro = '${{ steps.wsl.outputs.name }}'
          if ($distro) { wsl.exe --unregister $distro 2>$null }
