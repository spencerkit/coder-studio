name: Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
        type: string
      dry_run:
        description: "Run validation and pack dry-run only"
        required: true
        default: true
        type: boolean

concurrency:
  group: release-cli-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish CLI
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches CLI version
        run: pnpm release:check-version -- --tag "$RELEASE_TAG"

      - name: Quality check
        run: pnpm exec biome lint --diagnostic-level=error --max-diagnostics=none .

      - name: Test release scripts
        run: pnpm exec vitest run scripts/publish-cli.test.ts scripts/build-cli.test.ts scripts/check-release-version.test.ts --environment node

      - name: Test core
        run: pnpm --filter @coder-studio/core test

      - name: Test providers
        run: pnpm --filter @coder-studio/providers test

      - name: Test server
        run: pnpm --filter @coder-studio/server test

      - name: Test web
        run: pnpm --filter @coder-studio/web test

      - name: Validate publish package
        run: pnpm publish:cli

      - name: Publish CLI to npm
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret is required for publishing" >&2
            exit 1
          fi
          pnpm publish:cli -- --publish
